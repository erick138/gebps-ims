    cols:[{label:'Alert',render:a=>`<div class="cell ${read[a.key]?'':'unread unread-row'}"><div class="alert-ico ${a.sev}">${icon(ALERT_ICON[a.type]||'bell',16)}</div><div style="min-width:0;max-width:560px;white-space:normal"><b>${esc(a.title)}</b><span class="sub">${esc(a.text)}</span></div></div>`},{label:'Date',render:a=>fmtDate(a.when)},{label:'',render:a=>read[a.key]?'<span class="muted">Read</span>':pill('New','warn')}],
    actions:a=>`<button class="btn sm" data-act="open" data-id="${esc(a.key)}">Open</button> <button class="btn sm ghost" data-act="tog" data-id="${esc(a.key)}">${read[a.key]?'Mark unread':'Mark read'}</button>`,
    empty:'No alerts right now.',
    onAction:async(act,key)=>{const a=buildAlerts().find(x=>x.key===key); if(!a)return; if(act==='tog'){await commitToast(()=>api('POST','/notifications/read',{keys:[key],unread:!!read[key]}),null,'alerts')} if(act==='open'){try{await api('POST','/notifications/read',{keys:[key]}); await reload('alerts')}catch(e){} if(location.hash==='#'+a.link)route();else location.hash=a.link}}});
};

/* ================= users ================= */
function randPass(){const c='abcdefghjkmnpqrstuvwxyzABCDEFGHJKMNPQRSTUVWXYZ',d='23456789';let s='';const a=new Uint32Array(10);crypto.getRandomValues(a);a.forEach((n,i)=>s+=(i>=8?d:c)[n%(i>=8?d.length:c.length)]);return s}
const isAdminRole=r=>r==='admin'||r==='superadmin';
const roleOptions=()=>Object.keys(ROLE_LABEL).filter(k=>ME.role==='superadmin'||!isAdminRole(k)).map(k=>({v:k,l:ROLE_LABEL[k]}));
const canManageUser=u=>u.id===ME.id||ME.role==='superadmin'||!isAdminRole(u.role);
function openUserAdd(){
  openForm({title:'Add user account',wide:true,values:{role:'staff',pw:randPass()},submit:'Create account',
    intro:`<p class="muted" style="margin-bottom:12px">The account is active immediately. Share the temporary password privately; the user is asked to change it after signing in.</p>`,
    fields:[{name:'name',label:'Full name',required:true,span:2},{name:'username',label:'Username',required:true},{name:'email',label:'Email',type:'email',required:true},{name:'role',label:'Role',type:'select',required:true,options:roleOptions()},{name:'position',label:'Position'},{name:'phone',label:'Mobile number'},{name:'deptId',label:'Department',type:'select',options:DB.depts.map(d=>({v:d.id,l:d.name})),placeholder:'None'},{name:'personId',label:'Link to personnel record',type:'select',options:DB.personnel.filter(p=>!DB.users.some(x=>x.personId===p.id)).map(p=>({v:p.id,l:p.name+' · '+p.designation})),placeholder:'None',hint:'Lets the user see equipment issued to them.'},{name:'pw',label:'Temporary password',required:true,span:2}],
    onSubmit:async v=>{
      if(!/^[a-z0-9_.]{3,30}$/i.test(v.username))return 'Username needs 3–30 letters, numbers, dots or underscores.';
      if(v.pw.length<8||!/[A-Za-z]/.test(v.pw)||!/\d/.test(v.pw))return 'Password needs 8 or more characters, with letters and numbers.';
      const r=await commit(()=>api('POST','/users',{name:v.name,username:v.username,email:v.email,role:v.role,position:v.position||'',phone:v.phone||'',department_id:idOrNull(v.deptId),personnel_id:idOrNull(v.personId),password:v.pw}),'users');
      if(r===true)toast('Account created'); return r}});
}
function openApproveForm(id){
  const u=getUser(id);
  openForm({title:'Approve account',intro:`<p style="margin-bottom:12px"><b>${esc(u.name)}</b> (@${esc(u.username)}) · ${esc(u.position||'No position')} · ${esc(deptName(u.deptId))}</p>`,values:{role:'staff'},submit:'Approve account',
    fields:[{name:'role',label:'Role',type:'select',required:true,options:roleOptions()},{name:'personId',label:'Link to personnel record',type:'select',options:DB.personnel.filter(p=>!DB.users.some(x=>x.personId===p.id)).map(p=>({v:p.id,l:p.name+' · '+p.designation})),placeholder:'Create a new personnel record',hint:'Linking lets the user see the equipment issued to them.'}],
    onSubmit:async v=>{
      const r=await commit(async()=>{ let pid=v.personId;
        if(!pid){ pid=(await api('POST','/personnel',{emp_no:'EMP-'+String(Date.now()).slice(-7),name:u.name,designation:u.position||'Staff',department_id:idOrNull(u.deptId),contact:u.phone||'',email:u.email,status:'Active'})).data.id }
        await api('POST','/users/'+id+'/approve',{role:v.role,personnel_id:Number(pid)}) },'users','personnel');
      if(r===true)toast('Account approved'); return r}});
}
function openUserEdit(id){
  const u=getUser(id);
  openForm({title:'Edit user',values:Object.assign({},u),fields:[{name:'name',label:'Full name',required:true,span:2},{name:'email',label:'Email',type:'email',required:true},{name:'position',label:'Position'},{name:'phone',label:'Mobile number'},{name:'role',label:'Role',type:'select',required:true,options:roleOptions().concat(roleOptions().some(o=>o.v===u.role)?[]:[{v:u.role,l:ROLE_LABEL[u.role]}])},{name:'deptId',label:'Department',type:'select',options:DB.depts.map(d=>({v:d.id,l:d.name})),placeholder:'None'},{name:'personId',label:'Linked personnel record',type:'select',span:2,options:DB.personnel.map(p=>({v:p.id,l:p.name+' · '+p.designation})),placeholder:'Not linked'}],
    onSubmit:async v=>{ if(!canManageUser(u))return 'Only a super administrator can edit this account.';
      const r=await commit(async()=>{ await api('PUT','/users/'+id,{name:v.name,email:v.email,position:v.position||'',phone:v.phone||'',role:v.role,department_id:idOrNull(v.deptId),personnel_id:idOrNull(v.personId)}); if(id===ME.id)ME=await loadMe() },'users');
      if(r===true)toast('User updated'); return r}});
}
VIEWS.users=host=>{
  host.innerHTML=pageHead('User Accounts','Create accounts, approve registrations, assign roles and activate or deactivate accounts.',`<button class="btn primary" id="add-user">${icon('plus',16)} Add user</button>`)+`<section class="card" style="margin-top:16px" id="ulist"></section>`;
  $('#add-user').onclick=openUserAdd;
  renderList($('#ulist'),{key:'users',placeholder:'Search users',rows:()=>[...DB.users].sort((a,b)=>(a.status==='pending'?0:1)-(b.status==='pending'?0:1)),text:u=>[u.name,u.username,u.email,u.position].join(' '),
    filters:[{name:'st',label:'All statuses',options:[{v:'pending',l:'Pending approval'},{v:'active',l:'Active'},{v:'inactive',l:'Deactivated'}],test:(u,v)=>u.status===v},{name:'role',label:'All roles',options:Object.keys(ROLE_LABEL).map(k=>({v:k,l:ROLE_LABEL[k]})),test:(u,v)=>u.role===v}],
    cols:[{label:'User',render:u=>`<div class="cell"><span class="avatar">${esc(initials(u.name))}</span><div><b>${esc(u.name)}</b><span class="sub">@${esc(u.username)} · ${esc(u.email)}</span></div></div>`},{label:'Role',render:u=>u.status==='pending'?'<span class="muted">Not assigned</span>':esc(ROLE_LABEL[u.role])},{label:'Position',render:u=>`${esc(u.position||'—')}<span class="sub">${esc(deptName(u.deptId))}</span>`},{label:'Registered',render:u=>fmtDate(u.createdAt)},{label:'Last sign-in',render:u=>u.lastLogin?fmtDate(u.lastLogin):'—'},{label:'Status',render:u=>pill(u.status==='inactive'?'Deactivated':u.status==='pending'?'Pending':'Active',u.status==='active'?'ok':u.status==='pending'?'warn':'')}],
    actions:u=>u.status==='pending'?`<button class="btn sm primary" data-act="approve" data-id="${u.id}">Approve</button> <button class="btn sm" data-act="reject" data-id="${u.id}">Reject</button>`:!canManageUser(u)?'<span class="muted">Super admin only</span>':actBtn('edit',u.id,'edit','Edit user')+actBtn('pw',u.id,'key','Reset password')+(u.id!==ME.id?`<button class="btn sm" data-act="toggle" data-id="${u.id}">${u.status==='active'?'Deactivate':'Activate'}</button>`:''),
    onAction:async(act,id)=>{const u=getUser(id);
      if(act==='approve')openApproveForm(id); if(act==='edit')openUserEdit(id);
      if(act==='reject'&&await confirmBox({title:'Reject registration',danger:true,confirmLabel:'Reject',message:`Reject and remove the registration from <b>${esc(u.name)}</b>?`}))await commitToast(()=>api('DELETE','/users/'+id),'Registration rejected','users')
      if(act==='toggle'){ const to=u.status==='active'?'inactive':'active';
        if(!canManageUser(u)){toast('Only a super administrator can change this account.','bad');return}
        if(to==='inactive'&&isAdminRole(u.role)&&DB.users.filter(x=>isAdminRole(x.role)&&x.status==='active').length<2){toast('Keep at least one active administrator.','bad');return}
        if(to==='inactive'&&u.role==='superadmin'&&DB.users.filter(x=>x.role==='superadmin'&&x.status==='active').length<2){toast('Keep at least one active super administrator.','bad');return}
        if(await confirmBox({title:to==='inactive'?'Deactivate account':'Activate account',danger:to==='inactive',confirmLabel:to==='inactive'?'Deactivate':'Activate',message:to==='inactive'?`<b>${esc(u.name)}</b> will no longer be able to sign in.`:`Allow <b>${esc(u.name)}</b> to sign in again?`}))await commitToast(()=>api('POST','/users/'+id+'/'+(to==='inactive'?'deactivate':'activate')),to==='inactive'?'Account deactivated':'Account activated','users')}
      if(act==='pw'&&await confirmBox({title:'Reset password',confirmLabel:'Reset password',message:`Create a new temporary password for <b>${esc(u.name)}</b>? They must change it the next time they sign in.`})){
        try{ const j=await api('POST','/users/'+id+'/reset-password'); const pw=j.data.temporary_password; await reload('users'); route();
          const m=openModal({title:'Temporary password',foot:'<button class="btn ghost" data-close>Done</button><button class="btn primary" data-copy>Copy password</button>',body:`<p style="margin-bottom:12px">Give this password to <b>${esc(u.name)}</b> privately. It is shown only once.</p><div class="mono" style="font-size:22px;letter-spacing:.06em;padding:14px;border:1px dashed var(--line);border-radius:10px;text-align:center;user-select:all">${esc(pw)}</div>`});
          $('[data-copy]',m.el).onclick=()=>copyText(pw);
        }catch(x){toast(errText(x),'bad')} }
    }});
};

/* ================= profile ================= */
VIEWS.profile=host=>{
  const dataTools=false?`<section class="card"><div class="card-h"><h2>Data tools</h2></div><div class="card-b stack"><p class="muted">All records live in this browser. Export a backup regularly. Restoring replaces everything.</p><div class="row"><button class="btn" id="bk">${icon('download',15)} Export backup (JSON)</button><label class="btn" for="rs">Restore backup</label><input type="file" id="rs" accept=".json,application/json" hidden></div><hr style="border:0;border-top:1px solid var(--line);width:100%"><div class="row"><button class="btn" id="reseed">Reload sample data</button><button class="btn danger" id="wipe">Clear sample data and start fresh</button></div></div></section>`:'';
  host.innerHTML=pageHead('My Profile','Your account details and password.')+`<div class="grid cols-2" style="margin-top:16px;align-items:start"><section class="card"><div class="card-h"><h2>Profile</h2></div><div class="card-b"><form id="pf" novalidate><div class="form-grid">${[
    {name:'name',label:'Full name',required:true,span:2},{name:'email',label:'Email',type:'email',required:true},{name:'phone',label:'Mobile number',placeholder:'0917 123 4567'},{name:'position',label:'Position'},{name:'deptId',label:'Department',type:'select',options:DB.depts.map(d=>({v:d.id,l:d.name})),placeholder:'None'},{name:'smsOptIn',label:'SMS alerts',type:'checkbox',text:'Include me in SMS alerts',default:true,span:2}].map(f=>fieldHtml(f,ME[f.name])).join('')}<div class="field"><label>Role</label><input value="${esc(ROLE_LABEL[ME.role])}" readonly></div><div class="field"><label>Username</label><input value="${esc(ME.username)}" readonly></div></div><p class="form-err" id="pf-err" hidden></p><div class="row" style="margin-top:14px"><button class="btn primary" type="submit">Save profile</button></div></form></div></section>
  <div class="stack" style="gap:16px"><section class="card"><div class="card-h"><h2>Change password</h2></div><div class="card-b"><form id="pw" novalidate><div class="stack">${[{name:'cur',label:'Current password',type:'password',required:true,autocomplete:'current-password'},{name:'n1',label:'New password',type:'password',required:true,autocomplete:'new-password'},{name:'n2',label:'Confirm new password',type:'password',required:true,autocomplete:'new-password'}].map(f=>fieldHtml(f,'')).join('')}</div><p class="form-err" id="pw-err" hidden></p><div class="row" style="margin-top:14px"><button class="btn primary" type="submit">Update password</button></div></form></div></section>${dataTools}</div></div>`;
  const pf=$('#pf'), perr=$('#pf-err');
  pf.onsubmit=async e=>{e.preventDefault(); const g=n=>pf.elements[n].value.trim(); perr.hidden=true; const bad=t=>{perr.textContent=t;perr.hidden=false};
    if(!g('name')||!g('email'))return bad('Name and email are required.');
    if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(g('email')))return bad('Enter a valid email address.');
    try{ await api('PUT','/auth/me',{name:g('name'),email:g('email'),phone:g('phone'),position:g('position'),department_id:pf.elements.deptId.value||null,sms_opt_in:pf.elements.smsOptIn.checked}); ME=await loadMe(); toast('Profile saved'); renderShell() }catch(x){bad(errText(x))}};
  const pw=$('#pw'), werr=$('#pw-err');
  pw.onsubmit=async e=>{e.preventDefault(); werr.hidden=true; const bad=t=>{werr.textContent=t;werr.hidden=false};
    const n=pw.elements.n1.value; if(n.length<8||!/[A-Za-z]/.test(n)||!/\d/.test(n))return bad('New password needs 8 or more characters, with letters and numbers.');
    if(n!==pw.elements.n2.value)return bad('New passwords do not match.');
    try{ await api('POST','/auth/change-password',{current_password:pw.elements.cur.value,new_password:n}); pw.reset(); toast('Password updated') }catch(x){bad(errText(x))}};
};

/* ================= boot ================= */
async function loadPublic(){try{DB.depts=((await api('GET','/public/departments',undefined,{noAuth:true})).data||[]).map(mapDept)}catch(e){}}
async function startSession(){
  $('#app').innerHTML='<div style="padding:40px;text-align:center" class="muted">Loading your data…</div>';
  try{ await reload() }catch(e){ if(e instanceof ApiError&&e.status===401)return; $('#app').innerHTML='<div style="padding:32px;max-width:520px;margin:0 auto"><h2>Could not load the data</h2><p class="muted" style="margin:8px 0 16px">'+esc(errText(e))+'</p><button class="btn primary" id="retry">Try again</button> <button class="btn" id="so">Sign out</button></div>'; $('#retry').onclick=startSession; $('#so').onclick=logout; return }
  if(!location.hash||location.hash==='#')location.hash='dashboard';
  renderShell();
  if(!window.__poll)window.__poll=setInterval(()=>{ if(ME&&!document.hidden)reload('alerts').then(refreshChrome).catch(()=>{}) },60000);
}
(async function boot(){
  try{
    DB=emptyDB();
    const m=/^#reset=([0-9a-f]{64})$/.exec(location.hash);
    if(m){history.replaceState(null,'',location.pathname+location.search); await loadPublic(); renderAuth('reset','',m[1]); return}
    if(getToken()){ try{ ME=await loadMe() }catch(e){ if(e instanceof ApiError&&e.status===0){ $('#app').innerHTML='<div style="padding:32px;max-width:520px;margin:0 auto"><h2>Cannot reach the server</h2><p class="muted" style="margin:8px 0 16px">'+esc(e.message)+'</p><button class="btn primary" onclick="location.reload()">Try again</button></div>'; return } setToken(null); ME=null } }
    if(!ME){ await loadPublic(); renderAuth('login'); return }
    if(ME.mustChange){ renderAuth('force'); return }
    await startSession();
  }catch(err){ $('#app').innerHTML='<div style="padding:32px"><h2>Something went wrong while loading</h2><p class="muted">'+esc(err&&err.message||err)+'</p></div>'; console.error(err) }
})();
</script></body></html>
