<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>[hidden]{display:none!important}body{margin:0}img{max-width:100%}</style>
<title>GEBPSOICS Inventory Management System</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Public+Sans:wght@400;500;600;700&display=swap">
<style>
/* Layout: fixed left navigation panel + working area. Property-tag motif (amber header band, QR, Code 128) carries the identity. */
:root{
  --bg:#edf1f8; --surface:#ffffff; --surface-2:#f4f7fc; --ink:#111b30; --muted:#566178; --line:#dae1ee; --line-strong:#b9c5db;
  --accent:#1f4fb8; --accent-ink:#ffffff; --accent-soft:#dde7fb; --accent-hover:#173f98;
  --side:#0d1a3c; --side-ink:#dbe5f7; --side-muted:#8ea3c9; --side-active:#1a2e63; --side-line:#1f3068;
  --tag:#f0b21f; --tag-ink:#2b1d00;
  --ok:#17794a; --ok-soft:#d9f1e3; --info:#0a7a9c; --info-soft:#d8eff6; --warn:#9a5700; --warn-soft:#fae9c9;
  --bad:#b3261e; --bad-soft:#fadfdc; --purple:#68409e; --purple-soft:#eae1f6; --muted-soft:#e5eaf4;
  --shadow:0 1px 2px rgba(13,26,60,.06),0 4px 14px rgba(13,26,60,.06);
  --font:'Public Sans',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --mono:'IBM Plex Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0a111f; --surface:#111a2f; --surface-2:#16213a; --ink:#e6ecf8; --muted:#94a3c0; --line:#233050; --line-strong:#33446c;
    --accent:#6c9bff; --accent-ink:#06122e; --accent-soft:#17274d; --accent-hover:#93b4ff;
    --side:#070e1c; --side-ink:#d5def2; --side-muted:#7f93bb; --side-active:#15254a; --side-line:#182646;
    --tag:#f3bb34; --tag-ink:#2b1d00;
    --ok:#52c58a; --ok-soft:#143626; --info:#4fc3e8; --info-soft:#0f2f3d; --warn:#eba64a; --warn-soft:#3b2a10;
    --bad:#f0827a; --bad-soft:#3d1a18; --purple:#b494e8; --purple-soft:#2a1f45; --muted-soft:#1e2a45;
    --shadow:0 1px 2px rgba(0,0,0,.4),0 4px 14px rgba(0,0,0,.25);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0a111f; --surface:#111a2f; --surface-2:#16213a; --ink:#e6ecf8; --muted:#94a3c0; --line:#233050; --line-strong:#33446c;
  --accent:#6c9bff; --accent-ink:#06122e; --accent-soft:#17274d; --accent-hover:#93b4ff;
  --side:#070e1c; --side-ink:#d5def2; --side-muted:#7f93bb; --side-active:#15254a; --side-line:#182646;
  --tag:#f3bb34; --tag-ink:#2b1d00;
  --ok:#52c58a; --ok-soft:#143626; --info:#4fc3e8; --info-soft:#0f2f3d; --warn:#eba64a; --warn-soft:#3b2a10;
  --bad:#f0827a; --bad-soft:#3d1a18; --purple:#b494e8; --purple-soft:#2a1f45; --muted-soft:#1e2a45;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 4px 14px rgba(0,0,0,.25);
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{min-height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:14px;line-height:1.5;
  padding-block:0;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  -webkit-font-smoothing:antialiased}
h1,h2,h3,h4,p{margin:0}
h1,h2,h3{text-wrap:balance;letter-spacing:-.01em}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--accent)}
svg{display:block}
.mono{font-family:var(--mono);font-size:.92em;letter-spacing:-.01em}
.muted{color:var(--muted)}
.num{font-variant-numeric:tabular-nums}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}

/* ---------- shell ---------- */
.shell{display:grid;grid-template-columns:248px minmax(0,1fr);gap:20px;align-items:start;padding-block:16px;min-height:100vh}
.side{position:sticky;top:16px;background:var(--side);color:var(--side-ink);border-radius:10px;padding:16px 12px;display:flex;flex-direction:column;gap:14px;max-height:calc(100vh - 32px);overflow:auto}
.brand{display:flex;gap:10px;align-items:center;padding:2px 6px 10px;border-bottom:1px solid var(--side-line)}
.brand-mark{width:40px;height:40px;flex:none;object-fit:contain}
.brand b{display:block;font-size:15px;letter-spacing:.04em}
.brand span{display:block;font-size:11px;color:var(--side-muted);line-height:1.25}
.nav-group{display:flex;flex-direction:column;gap:2px}
.nav-group h4{font-size:10.5px;text-transform:uppercase;letter-spacing:.1em;color:var(--side-muted);padding:6px 10px 4px;font-weight:600}
.nav a{display:flex;gap:10px;align-items:center;padding:8px 10px;border-radius:6px;color:var(--side-ink);text-decoration:none;font-weight:500}
.nav a:hover{background:var(--side-active)}
.nav a[aria-current="page"]{background:var(--tag);color:var(--tag-ink);font-weight:600}
.nav a .badge{margin-left:auto}
.badge{background:var(--bad);color:#fff;border-radius:99px;font-size:11px;min-width:19px;height:19px;display:inline-grid;place-items:center;padding:0 6px;font-weight:600}
.side-foot{margin-top:auto;border-top:1px solid var(--side-line);padding:12px 6px 0;font-size:12px;color:var(--side-muted)}
.main{min-width:0;display:flex;flex-direction:column;gap:16px}
.topbar{display:flex;align-items:center;gap:10px;position:sticky;top:0;z-index:5;background:var(--bg);padding-block:0 4px}
.topbar .search{flex:1;max-width:460px;position:relative}
.topbar .search input{width:100%;padding-left:34px}
.topbar .search svg{position:absolute;left:10px;top:50%;transform:translateY(-50%);color:var(--muted)}
.spacer{flex:1}
.user-chip{display:flex;align-items:center;gap:8px;padding:4px 10px 4px 4px;border:1px solid var(--line);background:var(--surface);border-radius:99px;text-decoration:none;color:var(--ink)}
.user-chip small{display:block;color:var(--muted);font-size:11px;line-height:1.1;text-transform:capitalize}
.user-chip b{display:block;font-size:13px;line-height:1.2;font-weight:600}
.avatar{width:30px;height:30px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-weight:700;font-size:12px;flex:none}
.menu-btn{display:none}
.icon-btn{position:relative;width:36px;height:36px;display:inline-grid;place-items:center;border:1px solid var(--line);background:var(--surface);border-radius:8px;cursor:pointer;color:var(--ink)}
.icon-btn:hover{border-color:var(--line-strong)}
.icon-btn .badge{position:absolute;top:-6px;right:-6px}
.icon-btn.plain{border-color:transparent;background:transparent}
.icon-btn.sm{width:30px;height:30px;border-radius:6px}
.icon-btn.danger:hover{color:var(--bad);border-color:var(--bad)}
.scrim{display:none}

.page-head{display:flex;gap:12px 16px;align-items:flex-end;justify-content:space-between;flex-wrap:wrap}
.page-head h1{font-size:24px;line-height:1.15;font-weight:700}
.page-head p{color:var(--muted);margin-top:4px;max-width:62ch}
.head-actions{display:flex;gap:8px;flex-wrap:wrap}

/* ---------- controls ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;padding:8px 14px;border-radius:7px;border:1px solid var(--line-strong);background:var(--surface);cursor:pointer;font-weight:600;font-size:13.5px;text-decoration:none;color:var(--ink);white-space:nowrap;line-height:1.2}
.btn:hover{border-color:var(--ink)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{background:var(--accent-hover);border-color:var(--accent-hover)}
.btn.ghost{background:transparent}
.btn.danger{background:var(--bad);border-color:var(--bad);color:#fff}
.btn.sm{padding:5px 10px;font-size:12.5px}
.btn[disabled]{opacity:.5;cursor:not-allowed}
input,select,textarea{width:100%;padding:8px 10px;border:1px solid var(--line-strong);border-radius:7px;background:var(--surface);min-width:0}
input[type=checkbox]{width:auto}
input::placeholder,textarea::placeholder{color:var(--muted);opacity:.8}
input[readonly]{background:var(--surface-2);color:var(--muted)}
select{appearance:auto}
.field{display:flex;flex-direction:column;gap:5px;min-width:0}
.field label{font-weight:600;font-size:12.5px}
.field label i{color:var(--bad);font-style:normal}
.field small{color:var(--muted);font-size:12px}
.form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.span2{grid-column:1/-1}
.form-sec{grid-column:1/-1;font-size:11.5px;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);border-bottom:1px solid var(--line);padding-bottom:4px;margin-top:4px}
.form-err{color:var(--bad);background:var(--bad-soft);padding:8px 12px;border-radius:7px;margin-top:12px;font-weight:500}
.photo-field{display:flex;gap:12px;align-items:center}
.photo-prev{width:84px;height:84px;border:1px dashed var(--line-strong);border-radius:8px;display:grid;place-items:center;color:var(--muted);overflow:hidden;flex:none;background:var(--surface-2)}
.photo-prev img{width:100%;height:100%;object-fit:cover}
.photo-btns{display:flex;gap:8px;flex-wrap:wrap}

/* ---------- surfaces ---------- */
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow);min-width:0}
.card-h{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:14px 16px 0;flex-wrap:wrap}
.card-h h2{font-size:14.5px;font-weight:700}
.card-b{padding:14px 16px 16px}
.grid{display:grid;gap:16px}
.grid.cols-2{grid-template-columns:repeat(2,minmax(0,1fr))}
.grid.cols-3{grid-template-columns:repeat(3,minmax(0,1fr))}
.grid.cols-21{grid-template-columns:minmax(0,3fr) minmax(0,2fr)}
.stack{display:flex;flex-direction:column;gap:12px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.empty{padding:28px 16px;text-align:center;color:var(--muted)}
.empty b{display:block;color:var(--ink);margin-bottom:2px}
.callout{display:flex;gap:10px;padding:10px 12px;border-radius:8px;background:var(--info-soft);color:var(--ink);font-size:13px}
.callout.warn{background:var(--warn-soft)}
.callout svg{flex:none;color:var(--info);margin-top:2px}
.callout.warn svg{color:var(--warn)}

/* ---------- table ---------- */
.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;padding:12px 16px;border-bottom:1px solid var(--line)}
.toolbar .search{position:relative;flex:1 1 220px;max-width:340px}
.toolbar .search input{padding-left:32px}
.toolbar .search svg{position:absolute;left:9px;top:50%;transform:translateY(-50%);color:var(--muted)}
.toolbar select{width:auto;max-width:200px}
.table-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13.5px}
th{text-align:left;font-size:11.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600;padding:9px 12px;border-bottom:1px solid var(--line);white-space:nowrap;background:var(--surface-2)}
td{padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:middle}
tbody tr:hover td{background:var(--surface-2)}
tbody tr:last-child td{border-bottom:0}
td.act{white-space:nowrap;text-align:right}
td .sub{display:block;color:var(--muted);font-size:12px}
.thumb{width:38px;height:38px;border-radius:6px;background:var(--surface-2);border:1px solid var(--line);display:grid;place-items:center;color:var(--muted);overflow:hidden;flex:none}
.thumb img{width:100%;height:100%;object-fit:cover}
.cell{display:flex;gap:10px;align-items:center;min-width:0}
.linkish{background:none;border:0;padding:0;color:var(--ink);font-weight:600;cursor:pointer;text-align:left}
.linkish:hover{color:var(--accent);text-decoration:underline}
.pager{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 16px;border-top:1px solid var(--line);color:var(--muted);font-size:12.5px;flex-wrap:wrap}
.pager .row{gap:6px}
.pill{display:inline-flex;align-items:center;gap:6px;padding:2px 9px;border-radius:99px;font-size:12px;font-weight:600;white-space:nowrap;background:var(--muted-soft);color:var(--muted)}
.pill::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.pill.ok{background:var(--ok-soft);color:var(--ok)}
.pill.info{background:var(--info-soft);color:var(--info)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.bad{background:var(--bad-soft);color:var(--bad)}
.pill.purple{background:var(--purple-soft);color:var(--purple)}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);padding:0 16px;overflow-x:auto}
.tabs button{background:none;border:0;border-bottom:2px solid transparent;padding:11px 12px;font-weight:600;color:var(--muted);cursor:pointer;white-space:nowrap}
.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--tag)}
.tabs button .badge{margin-left:6px;vertical-align:1px}

/* ---------- dashboard ---------- */
.stat-strip{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));border:1px solid var(--line);background:var(--surface);border-radius:10px;overflow:hidden;box-shadow:var(--shadow)}
.stat{padding:14px 16px;display:flex;flex-direction:column;gap:2px;text-align:left;background:none;border:0;border-right:1px solid var(--line);cursor:pointer;min-width:0}
.stat:last-child{border-right:0}
.stat:hover{background:var(--surface-2)}
.stat .lab{display:flex;align-items:center;gap:7px;color:var(--muted);font-size:12px;font-weight:600}
.stat .dot{width:9px;height:9px;border-radius:2px;flex:none}
.stat .val{font-size:28px;font-weight:700;line-height:1.1;font-variant-numeric:tabular-nums}
.stat .pct{color:var(--muted);font-size:12px}
.statbar{display:flex;height:8px;border-radius:99px;overflow:hidden;background:var(--muted-soft)}
.c-ok{--c:var(--ok)}.c-info{--c:var(--info)}.c-purple{--c:var(--purple)}.c-warn{--c:var(--warn)}.c-bad{--c:var(--bad)}.c-tot{--c:var(--ink)}
.dot,.seg{background:var(--c)}
.hbar{display:grid;grid-template-columns:minmax(90px,170px) minmax(0,1fr) 38px;gap:10px;align-items:center;font-size:13px;padding:5px 0}
.hbar .l{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hbar .t{height:10px;background:var(--muted-soft);border-radius:3px;overflow:hidden}
.hbar .t i{display:block;height:100%;background:var(--accent);border-radius:3px}
.hbar .v{text-align:right;font-weight:600;font-variant-numeric:tabular-nums}
.donut-wrap{display:flex;gap:20px;align-items:center;flex-wrap:wrap}
.legend{display:flex;flex-direction:column;gap:6px;flex:1;min-width:140px}
.legend div{display:flex;align-items:center;gap:8px;font-size:13px}
.legend .dot{width:10px;height:10px;border-radius:2px}
.legend b{margin-left:auto;font-variant-numeric:tabular-nums}
.chart-txt{fill:var(--muted);font-size:10px;font-family:var(--font)}
.chart-val{fill:var(--ink);font-size:10px;font-weight:600;font-family:var(--font)}
.list{display:flex;flex-direction:column}
.list-item{display:flex;gap:12px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line);min-width:0}
.list-item:last-child{border-bottom:0;padding-bottom:0}
.list-item:first-child{padding-top:0}
.list-item .grow{flex:1;min-width:0}
.list-item .grow b{display:block;font-weight:600;overflow:hidden;text-overflow:ellipsis}
.list-item .grow span{color:var(--muted);font-size:12.5px;display:block}
.alert-ico{width:32px;height:32px;border-radius:8px;display:grid;place-items:center;flex:none;background:var(--info-soft);color:var(--info)}
.alert-ico.warn{background:var(--warn-soft);color:var(--warn)}
.alert-ico.bad{background:var(--bad-soft);color:var(--bad)}
.alert-ico.ok{background:var(--ok-soft);color:var(--ok)}
.unread{box-shadow:inset 3px 0 0 var(--tag)}
.unread-row{padding-left:10px}

/* ---------- modal / toast ---------- */
.overlay{position:fixed;inset:0;background:rgba(8,16,14,.55);display:flex;justify-content:center;align-items:flex-start;padding:5vh 12px;overflow:auto;z-index:50}
.modal{background:var(--surface);color:var(--ink);border-radius:12px;width:min(560px,100%);box-shadow:0 20px 60px rgba(0,0,0,.35);display:flex;flex-direction:column;border:1px solid var(--line)}
.modal.wide{width:min(860px,100%)}
.modal-h{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:14px 18px;border-bottom:1px solid var(--line)}
.modal-h h2{font-size:16px}
.modal-b{padding:18px}
.modal-f{display:flex;justify-content:flex-end;gap:8px;padding:12px 18px;border-top:1px solid var(--line);flex-wrap:wrap}
.confirm-msg{line-height:1.55}
#toast-root{position:fixed;bottom:calc(16px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);display:flex;flex-direction:column;gap:8px;z-index:80;width:min(440px,calc(100vw - 32px));pointer-events:none}
.toast{background:var(--ink);color:var(--bg);padding:10px 14px;border-radius:8px;font-weight:500;box-shadow:var(--shadow);display:flex;gap:10px;align-items:center}
.toast.bad{background:var(--bad);color:#fff}
.toast.ok svg{color:var(--ok)}

/* ---------- detail / kv ---------- */
.kv{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px 18px}
.kv div{min-width:0}
.kv dt{font-size:11.5px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);font-weight:600}
.kv dd{margin:2px 0 0;overflow-wrap:anywhere}
.detail-top{display:grid;grid-template-columns:150px minmax(0,1fr);gap:18px}
.detail-photo{width:150px;height:150px;border-radius:10px;border:1px solid var(--line);background:var(--surface-2);display:grid;place-items:center;color:var(--muted);overflow:hidden}
.detail-photo img{width:100%;height:100%;object-fit:cover}
.timeline{display:flex;flex-direction:column;gap:0;border-left:2px solid var(--line);margin-left:6px}
.timeline li{list-style:none;padding:0 0 12px 16px;position:relative;font-size:13px}
.timeline li::before{content:"";position:absolute;left:-6px;top:5px;width:10px;height:10px;border-radius:50%;background:var(--accent);border:2px solid var(--surface)}
.timeline{padding:0;margin:0}
.timeline small{color:var(--muted);display:block}

/* ---------- property tag (printed object) ---------- */
.tag{width:100%;max-width:380px;border:1.5px solid #14201d;border-radius:6px;background:#fff;color:#14201d;overflow:hidden;font-family:var(--font)}
.tag-h{background:var(--tag);color:#2b1d00;font-weight:700;font-size:11px;letter-spacing:.12em;padding:5px 10px;display:flex;justify-content:space-between;text-transform:uppercase}
.tag-b{display:grid;grid-template-columns:92px minmax(0,1fr);gap:10px;padding:10px}
.tag-b svg{width:92px;height:92px}
.tag-no{font-family:var(--mono);font-weight:600;font-size:14px;letter-spacing:-.02em}
.tag-nm{font-weight:600;font-size:13px;line-height:1.25;margin-top:2px}
.tag-meta{font-size:11px;color:#4d5d59;margin-top:3px;line-height:1.35}
.tag-bar{padding:0 10px 8px}
.tag-bar svg{width:100%;height:34px}
.tag-bar div{font-family:var(--mono);font-size:10.5px;text-align:center;letter-spacing:.15em;margin-top:1px}
.tag-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px}
.pick-list{max-height:380px;overflow:auto;border:1px solid var(--line);border-radius:8px}
.pick-list label{display:flex;gap:10px;align-items:center;padding:8px 12px;border-bottom:1px solid var(--line);cursor:pointer}
.pick-list label:last-child{border-bottom:0}
.pick-list label:hover{background:var(--surface-2)}
.scan-box{display:flex;gap:8px}
.scan-box input{font-family:var(--mono);font-size:16px;padding:12px}
.v-stat{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.v-stat div{background:var(--surface-2);border:1px solid var(--line);border-radius:8px;padding:10px 12px}
.v-stat b{font-size:22px;display:block;line-height:1.15}
.v-stat span{font-size:12px;color:var(--muted)}

/* ---------- reports ---------- */
.rep-layout{display:grid;grid-template-columns:300px minmax(0,1fr);gap:16px;align-items:start}
.rep-list{display:flex;flex-direction:column}
.rep-list button{text-align:left;background:none;border:0;border-bottom:1px solid var(--line);padding:12px 16px;cursor:pointer;display:flex;flex-direction:column;gap:2px}
.rep-list button:last-child{border-bottom:0}
.rep-list button:hover{background:var(--surface-2)}
.rep-list button[aria-current="true"]{background:var(--accent-soft);box-shadow:inset 3px 0 0 var(--accent)}
.rep-list b{font-size:13.5px}
.rep-list span{font-size:12px;color:var(--muted)}
.rep-filters{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end}
.rep-filters .field{min-width:140px;flex:1 1 140px;max-width:220px}
.summary-row{display:flex;gap:8px 18px;flex-wrap:wrap;color:var(--muted);font-size:13px}
.summary-row b{color:var(--ink)}

/* ---------- auth ---------- */
.auth{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);min-height:100vh;gap:0}
.auth-art{background:var(--side);color:var(--side-ink);padding:48px 40px;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:32px;border-radius:12px;margin-block:16px}
.auth-art h1{font-size:34px;line-height:1.1;color:#fff;max-width:14ch}
.auth-art p{color:var(--side-muted);max-width:44ch;margin-top:12px}
.auth-art .tag{box-shadow:0 14px 40px rgba(0,0,0,.35);transform:rotate(-2deg)}
.auth-form{display:flex;align-items:center;justify-content:center;padding:32px 16px}
.auth-card{width:min(420px,100%);display:flex;flex-direction:column;gap:16px}
.auth-card h2{font-size:24px}
.auth-links{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;font-size:13px}
.auth-links button{background:none;border:0;color:var(--accent);cursor:pointer;padding:0;font-weight:600}
.demo-box{border:1px dashed var(--line-strong);border-radius:8px;padding:12px;font-size:12.5px;display:flex;flex-direction:column;gap:8px;background:var(--surface)}
.demo-box .row button{font-family:var(--mono);font-size:12px}
.ok-box{background:var(--ok-soft);color:var(--ok);padding:12px;border-radius:8px;font-weight:500}


/* ---------- footer ---------- */
.main{min-height:calc(100vh - 32px)}
.main #view{flex:1}
.app-foot,.auth-foot{color:var(--muted);font-size:12px;letter-spacing:.02em;text-align:center}
.app-foot{border-top:1px solid var(--line);padding:14px 0 4px;margin-top:8px}
.auth-foot{position:absolute;bottom:18px;left:16px;right:16px}
.auth-form{padding-bottom:64px}
/* ---------- attachments ---------- */
.file-pick{display:flex;flex-direction:column;gap:8px;align-items:flex-start}
.file-list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px;width:100%}
.file-list li{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:6px 10px;border:1px solid var(--line);border-radius:7px;background:var(--surface-2)}
.file-list .fname{display:flex;gap:6px;align-items:center;min-width:0;overflow-wrap:anywhere}
.file-list small{color:var(--muted)}
.attach{border:1px solid var(--line);border-radius:8px;padding:12px;display:flex;flex-direction:column;gap:10px}
.attach-img{max-width:100%;max-height:420px;object-fit:contain;border-radius:6px;background:var(--surface-2);align-self:flex-start}
/* ---------- theme switch ---------- */
.theme-switch{position:relative;width:58px;height:32px;border-radius:99px;border:1px solid var(--line-strong);background:var(--muted-soft);cursor:pointer;padding:0;flex:none;display:inline-block}
.theme-switch .ts-ic{position:absolute;top:50%;transform:translateY(-50%);color:var(--muted);display:grid;place-items:center;width:20px;height:20px}
.theme-switch .ts-ic:nth-child(1){left:6px}.theme-switch .ts-ic:nth-child(2){right:6px}
.theme-switch .ts-knob{position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:var(--accent);box-shadow:0 1px 3px rgba(0,0,0,.35);transition:transform .18s}
.theme-switch[aria-checked="true"] .ts-knob{transform:translateX(26px)}
.auth-top{position:absolute;top:20px;right:max(16px,env(safe-area-inset-right,0px));display:flex;align-items:center;gap:14px}
.clock{display:flex;flex-direction:column;align-items:flex-end;line-height:1.2;white-space:nowrap;font-variant-numeric:tabular-nums}
.clock .c-time{font-size:15px;font-weight:700;color:var(--ink)}
.clock .c-date{font-size:12px;color:var(--muted)}
@media (max-width:640px){.clock .c-date{display:none}.clock .c-time{font-size:13px}}
.auth-form{position:relative}
@media (max-width:1100px){
  .stat-strip{grid-template-columns:repeat(3,minmax(0,1fr))}
  .stat:nth-child(3){border-right:0}
  .stat:nth-child(-n+3){border-bottom:1px solid var(--line)}
  .grid.cols-3{grid-template-columns:repeat(2,minmax(0,1fr))}
  .rep-layout{grid-template-columns:1fr}
}
@media (max-width:900px){
  .shell{grid-template-columns:minmax(0,1fr)}
  .side{position:fixed;top:0;left:0;bottom:0;width:min(290px,86vw);max-height:none;border-radius:0 12px 12px 0;z-index:60;transform:translateX(-105%);transition:transform .2s;padding-top:calc(16px + env(safe-area-inset-top,0px));padding-left:calc(12px + env(safe-area-inset-left,0px))}
  body.nav-open .side{transform:none}
  body.nav-open .scrim{display:block;position:fixed;inset:0;background:rgba(8,16,14,.5);z-index:55}
  .menu-btn{display:inline-grid}
  .grid.cols-2,.grid.cols-21{grid-template-columns:minmax(0,1fr)}
  .auth{grid-template-columns:1fr}
  .auth-art{padding:28px 22px}
  .auth-art h1{font-size:26px}
  .user-chip div{display:none}
  .user-chip{padding:3px}
}
@media (max-width:640px){
  .stat-strip{grid-template-columns:repeat(2,minmax(0,1fr))}
  .stat,.stat:nth-child(3){border-right:1px solid var(--line);border-bottom:1px solid var(--line)}
  .stat:nth-child(2n){border-right:0}
  .stat:nth-last-child(-n+2){border-bottom:0}
  .grid.cols-3{grid-template-columns:minmax(0,1fr)}
  .form-grid,.kv{grid-template-columns:minmax(0,1fr)}
  .detail-top{grid-template-columns:minmax(0,1fr)}
  .hbar{grid-template-columns:minmax(70px,110px) minmax(0,1fr) 34px}
  .modal-b{padding:14px}
  .tag-grid{grid-template-columns:minmax(0,1fr)}
  .v-stat{grid-template-columns:minmax(0,1fr)}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

const pad=n=>String(n).padStart(2,'0');
const fmtISO=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const todayStr=()=>fmtISO(new Date());
const addDays=(s,n)=>{const d=new Date(s+'T00:00:00');d.setDate(d.getDate()+n);return fmtISO(d)};
const addMonths=(s,n)=>{const d=new Date(s+'T00:00:00');d.setMonth(d.getMonth()+n);return fmtISO(d)};
const diffDays=(a,b)=>Math.round((new Date(a+'T00:00:00')-new Date(b+'T00:00:00'))/864e5);
const fmtDate=s=>s?new Date(String(s).slice(0,10)+'T00:00:00').toLocaleDateString('en-PH',{day:'2-digit',month:'short',year:'numeric'}):'—';
const nowISO=()=>new Date().toISOString();
const peso=n=>'₱'+Number(n||0).toLocaleString('en-PH',{minimumFractionDigits:2,maximumFractionDigits:2});
const pesoPlain=n=>'PHP '+Number(n||0).toLocaleString('en-PH',{minimumFractionDigits:2,maximumFractionDigits:2});
const compact=n=>n>=1e6?(n/1e6).toFixed(n>=1e7?0:1).replace(/\.0$/,'')+'M':n>=1e3?Math.round(n/1e3)+'K':String(Math.round(n));
const initials=n=>String(n||'?').trim().split(/\s+/).filter(Boolean).slice(0,2).map(w=>w[0].toUpperCase()).join('')||'?';
const plural=(n,w)=>n+' '+w+(n===1?'':'s');

async function sha(s){
  try{ if(window.crypto&&crypto.subtle){const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode('gebp|'+s));return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')}}catch(e){}
  let h=5381; for(const ch of 'gebp|'+s) h=((h<<5)+h+ch.charCodeAt(0))|0; return 'x'+(h>>>0).toString(16);
}

function genPropNo(db,catId,acqDate){
  const cat=db.cats.find(c=>c.id===catId); const yr=(acqDate||todayStr()).slice(0,4);
  const prefix='GEB-'+yr+'-'+(cat?cat.code:'GEN')+'-'; let max=0;
  db.equipment.forEach(e=>{if(e.propNo.startsWith(prefix))max=Math.max(max,parseInt(e.propNo.slice(prefix.length),10)||0)});
  return prefix+String(max+1).padStart(4,'0');
}
function genBarcode(db){ let n; do{ n='4800'+String(++db.seq).padStart(8,'0') }while(db.equipment.some(e=>e.barcode===n)); return n }
function nextDocNo(prefix,list){ const yr=new Date().getFullYear(); const k=prefix+'-'+yr+'-'; let max=0; list.forEach(x=>{ if(x.no&&x.no.startsWith(k)) max=Math.max(max,parseInt(x.no.slice(k.length),10)||0)}); return k+String(max+1).padStart(4,'0') }

function code128B(text){
  const codes=[104]; let sum=104;
  for(const ch of String(text)){const c=ch.charCodeAt(0)-32; if(c<0||c>95)continue; codes.push(c); sum+=c*(codes.length-1)}
  codes.push(sum%103); codes.push(106);
  return codes.map(c=>C128[c]).join('');
}
function barcodeBars(text){ // -> {total, bars:[[x,w]]} with 10 module quiet zones
  const pat=code128B(text); let x=10; const bars=[];
  [...pat].forEach((d,i)=>{const w=+d; if(i%2===0)bars.push([x,w]); x+=w});
  return {total:x+10,bars};
}
function barcodeSvg(text){
  const {total,bars}=barcodeBars(text);
  return `<svg viewBox="0 0 ${total} 40" preserveAspectRatio="none" role="img" aria-label="Barcode ${esc(text)}"><rect width="${total}" height="40" fill="#fff"/>${bars.map(b=>`<rect x="${b[0]}" y="0" width="${b[1]}" height="40" fill="#000"/>`).join('')}</svg>`;
}
function qrMake(text){ try{ if(typeof qrcode==='undefined')return null; const q=qrcode(0,'M'); q.addData(text); q.make(); return q }catch(e){return null} }
function qrSvg(text){
  const q=qrMake(text); if(!q)return '<div class="empty muted">QR library not loaded</div>';
  const n=q.getModuleCount(); let d='';
  for(let r=0;r<n;r++)for(let c=0;c<n;c++)if(q.isDark(r,c))d+=`M${c} ${r}h1v1h-1z`;
  return `<svg viewBox="-2 -2 ${n+4} ${n+4}" shape-rendering="crispEdges" role="img" aria-label="QR code ${esc(text)}"><rect x="-2" y="-2" width="${n+4}" height="${n+4}" fill="#fff"/><path d="${d}" fill="#000"/></svg>`;
}

class ApiError extends Error{constructor(msg,status,details,code){super(msg);this.status=status;this.details=details||null;this.code=code||''}}
async function api(method,path,body,opt){
  const h={Accept:'application/json'}, t=getToken(); if(t&&!(opt&&opt.noAuth))h.Authorization='Bearer '+t;
  const init={method,headers:h}; if(body!==undefined){h['Content-Type']='application/json';init.body=JSON.stringify(body)}
  let res; try{res=await fetch(API_BASE+path,init)}catch(e){throw new ApiError('Cannot reach the server. Check your connection and try again.',0)}
  let j=null; try{j=await res.json()}catch(e){}
  if(!res.ok){
    if(res.status===401&&t&&path!=='/auth/login'){sessionExpired()}
    throw new ApiError((j&&j.error)||('The server returned an error ('+res.status+').'),res.status,j&&j.details,j&&j.code);
  }
  return j||{};
}
/** Text to show in a form when a request fails. */
function errText(e){
  if(e instanceof ApiError){
    if(e.details){const m=Object.values(e.details).filter(Boolean); if(m.length)return m.join(' ')}
    return e.message;
  }
  console.error(e); return 'Something went wrong. Please try again.';
}

const curTheme=()=>{const a=document.documentElement.getAttribute('data-theme'); if(a==='dark'||a==='light')return a; return (window.matchMedia&&matchMedia('(prefers-color-scheme: dark)').matches)?'dark':'light'};
function syncSwitches(){const d=curTheme()==='dark'; $$('[data-theme-toggle]').forEach(b=>{b.setAttribute('aria-checked',String(d));b.title=d?'Switch to light mode':'Switch to dark mode'})}
function applyTheme(t,persist){document.documentElement.setAttribute('data-theme',t); if(persist!==false){try{localStorage.setItem(THEMEKEY,t)}catch(e){}} syncSwitches()}
const themeSwitch=()=>`<button type="button" class="theme-switch" role="switch" aria-checked="${curTheme()==='dark'}" aria-label="Dark mode" data-theme-toggle title="${curTheme()==='dark'?'Switch to light mode':'Switch to dark mode'}"><span class="ts-ic">${icon('sun',15)}</span><span class="ts-ic">${icon('moon',15)}</span><i class="ts-knob"></i></button>`;
document.addEventListener('click',e=>{if(e.target.closest('[data-theme-toggle]'))applyTheme(curTheme()==='dark'?'light':'dark')});
try{const t=localStorage.getItem(THEMEKEY); if(t==='dark'||t==='light')document.documentElement.setAttribute('data-theme',t)}catch(e){}

/* ---------- toast ---------- */
function toast(msg,kind){
  const root=$('#toast-root'); if(!root)return;
  const el=document.createElement('div'); el.className='toast '+(kind||'ok'); el.setAttribute('role','status');
  el.innerHTML=(kind==='bad'?icon('alert',16):kind==='warn'?icon('info',16):icon('check',16))+'<span>'+esc(msg)+'</span>';
  root.appendChild(el); setTimeout(()=>el.remove(),kind==='bad'?7000:3600);
}

/* ---------- modal ---------- */
let modalStack=[];
function openModal({title,body,foot='',wide=false,onMount,onClose}){
  const el=document.createElement('div'); el.className='overlay';
  el.innerHTML=`<div class="modal ${wide?'wide':''}" role="dialog" aria-modal="true" aria-label="${esc(title)}"><header class="modal-h"><h2>${esc(title)}</h2><button class="icon-btn plain" data-close aria-label="Close" type="button">${icon('x')}</button></header><div class="modal-b">${body}</div>${foot?`<footer class="modal-f">${foot}</footer>`:''}</div>`;
  $('#modal-root').appendChild(el);
  const close=()=>{ if(!el.isConnected)return; el.remove(); modalStack=modalStack.filter(m=>m.el!==el); onClose&&onClose(); };
  el.addEventListener('mousedown',e=>{if(e.target===el)close()});
  el.addEventListener('click',e=>{if(e.target.closest('[data-close]'))close()});
  const m={el,close}; modalStack.push(m); onMount&&onMount(el,close);
  return m;
}
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&modalStack.length)modalStack[modalStack.length-1].close()});
function closeAllModals(){[...modalStack].forEach(m=>m.close())}
function confirmBox({title='Please confirm',message,confirmLabel='Confirm',danger=false}){
  return new Promise(res=>{
    const m=openModal({title,body:`<p class="confirm-msg">${message}</p>`,foot:`<button class="btn ghost" data-close type="button">Cancel</button><button class="btn ${danger?'danger':'primary'}" data-ok type="button">${esc(confirmLabel)}</button>`,onClose:()=>res(false)});
    $('[data-ok]',m.el).onclick=()=>{res(true);m.close()};
  });
}

/* ---------- forms ---------- */
function optionsHtml(opts,sel,placeholder){
  let h=placeholder!==undefined?`<option value="">${esc(placeholder)}</option>`:'';
  (opts||[]).forEach(o=>{const v=typeof o==='object'?o.v:o, l=typeof o==='object'?o.l:o; h+=`<option value="${esc(v)}"${String(v)===String(sel==null?'':sel)?' selected':''}>${esc(l)}</option>`});
  return h;
}
function fieldHtml(f,v){
  const id='f_'+f.name, val=v==null?(f.default==null?'':f.default):v, req=f.required?' required':'', ro=f.readonly?' readonly':'';
  let ctl='';
  if(f.type==='select') ctl=`<select id="${id}" name="${f.name}"${req}>${optionsHtml(f.options,val,f.placeholder)}</select>`;
  else if(f.type==='textarea') ctl=`<textarea id="${id}" name="${f.name}" rows="${f.rows||3}"${req}${ro} placeholder="${esc(f.placeholder||'')}">${esc(val)}</textarea>`;
  else if(f.type==='photo') ctl=`<div class="photo-field"><div class="photo-prev" id="${id}_prev">${val?`<img src="${esc(val)}" alt="Equipment photo">`:icon('box',28)}</div><div class="photo-btns"><label class="btn ghost sm" for="${id}_file">Choose photo</label><input type="file" id="${id}_file" accept="image/*" hidden><button type="button" class="btn ghost sm" data-photo-clear="${f.name}">Remove</button></div><input type="hidden" name="${f.name}" id="${id}" value="${esc(val)}"></div>`;
  else if(f.type==='files') ctl=`<div class="file-pick"><label class="btn ghost sm" for="${id}_file">${icon('paperclip',14)} Attach files</label><input type="file" id="${id}_file" data-multi="1" accept="${esc(f.accept||'')}" multiple hidden><ul class="file-list" id="${id}_list"></ul></div>`;
  else if(f.type==='checkbox') ctl=`<label class="row" style="font-weight:500"><input type="checkbox" id="${id}" name="${f.name}"${val?' checked':''}> ${esc(f.text||'')}</label>`;
  else ctl=`<input id="${id}" name="${f.name}" type="${f.type||'text'}" value="${esc(val)}"${req}${ro}${f.min!=null?` min="${f.min}"`:''}${f.max!=null?` max="${f.max}"`:''}${f.step?` step="${f.step}"`:''} placeholder="${esc(f.placeholder||'')}" autocomplete="${f.autocomplete||'off'}">`;
  return `<div class="field ${f.span===2?'span2':''}"><label for="${id}">${esc(f.label)}${f.required?' <i>*</i>':''}</label>${ctl}${f.hint?`<small>${esc(f.hint)}</small>`:''}</div>`;
}
function readPhoto(file,max=480){
  return new Promise((res,rej)=>{
    const fr=new FileReader();
    fr.onload=()=>{const img=new Image(); img.onload=()=>{const r=Math.min(1,max/Math.max(img.width,img.height)); const c=document.createElement('canvas'); c.width=Math.max(1,Math.round(img.width*r)); c.height=Math.max(1,Math.round(img.height*r)); const cx=c.getContext('2d'); cx.fillStyle='#fff'; cx.fillRect(0,0,c.width,c.height); cx.drawImage(img,0,0,c.width,c.height); res(c.toDataURL('image/jpeg',0.78))}; img.onerror=rej; img.src=fr.result};
    fr.onerror=rej; fr.readAsDataURL(file);
  });
}
const fmtSize=n=>n>=1048576?(n/1048576).toFixed(1)+' MB':Math.max(1,Math.round(n/1024))+' KB';
async function readAttachment(file){
  if(file.type.startsWith('image/')){const data=await readPhoto(file,1400); return {name:file.name.replace(/\.[^.]+$/,'')+'.jpg',type:'image/jpeg',size:Math.round(data.length*0.75),data}}
  if(file.size>1.5*1048576)throw new Error(file.name+' is larger than 1.5 MB.');
  const data=await new Promise((res,rej)=>{const fr=new FileReader();fr.onload=()=>res(fr.result);fr.onerror=rej;fr.readAsDataURL(file)});
  return {name:file.name,type:file.type||'application/octet-stream',size:file.size,data};
}
function dataUrlToBlob(u){const [h,b]=u.split(','),mime=(h.match(/:(.*?);/)||[])[1]||'application/octet-stream',bin=atob(b),a=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)a[i]=bin.charCodeAt(i);return new Blob([a],{type:mime})}
function openForm({title,fields,values={},submit='Save',wide=false,onSubmit,intro='',footExtra=''}){
  const body=`<form id="genform" novalidate>${intro}<div class="form-grid">${fields.map(f=>f.type==='section'?`<h3 class="form-sec">${esc(f.label)}</h3>`:fieldHtml(f,values[f.name])).join('')}</div><p class="form-err" id="genform-err" role="alert" hidden></p></form>`;
  const m=openModal({title,body,wide,foot:`${footExtra}<button class="btn ghost" data-close type="button">Cancel</button><button class="btn primary" type="submit" form="genform">${esc(submit)}</button>`});
  const form=$('#genform',m.el), err=$('#genform-err',m.el);
  const showErr=t=>{err.textContent=t;err.hidden=false};
  form._files={};
  const drawFiles=n=>{const ul=$('#f_'+n+'_list',m.el); if(!ul)return; const l=form._files[n]||[]; ul.innerHTML=l.map((a,i)=>`<li><span class="fname">${icon('paperclip',14)} <b>${esc(a.name)}</b> <small>${fmtSize(a.size)}</small></span><button type="button" class="btn sm ghost" data-rmfile="${n}:${i}">Remove</button></li>`).join('')};
  form.addEventListener('change',async e=>{
    if(e.target.dataset&&e.target.dataset.multi){
      const n=e.target.id.replace(/^f_/,'').replace(/_file$/,''); const cur=form._files[n]=form._files[n]||[]; err.hidden=true;
      for(const f of [...e.target.files]){
        if(cur.length>=3){showErr('You can attach up to 3 files.');break}
        try{const a=await readAttachment(f); if(cur.reduce((s,x)=>s+x.size,0)+a.size>3.5*1048576){showErr('Attachments are limited to about 3.5 MB in total.');break} cur.push(a)}catch(x){showErr(x&&x.message?x.message:'That file could not be read.')}
      }
      e.target.value=''; drawFiles(n); return;
    }
    if(e.target.matches('input[type=file]')){
      const f=e.target.files[0]; if(!f)return; const name=e.target.id.replace(/^f_/,'').replace(/_file$/,'');
      try{const url=await readPhoto(f); form.elements.namedItem(name).value=url; $('#f_'+name+'_prev',m.el).innerHTML=`<img src="${url}" alt="Preview">`}catch(x){showErr('That image could not be read. Try a JPG or PNG file.')}
    }
  });
  form.addEventListener('click',e=>{const r=e.target.closest('[data-rmfile]'); if(r){const [n,i]=r.dataset.rmfile.split(':'); form._files[n].splice(+i,1); drawFiles(n); return} const b=e.target.closest('[data-photo-clear]'); if(b){form.elements.namedItem(b.dataset.photoClear).value=''; $('#f_'+b.dataset.photoClear+'_prev',m.el).innerHTML=icon('box',28)}});
  form.addEventListener('submit',async ev=>{
    ev.preventDefault(); err.hidden=true; const vals={};
    for(const f of fields){
      if(f.type==='section')continue; if(f.type==='files'){const l=form._files[f.name]||[]; if(f.required&&!l.length){showErr('Attach at least one supporting file.');return} vals[f.name]=l; continue} const el=form.elements.namedItem(f.name); let v=el.type==='checkbox'?el.checked:el.value;
      if(typeof v==='string'&&f.type!=='password')v=v.trim();
      if(f.required&&(v===''||v==null)){showErr(f.label+' is required.');el.focus&&el.focus();return}
      if(f.type==='number'&&v!==''){v=Number(v); if(isNaN(v)){showErr(f.label+' must be a number.');return} if(f.min!=null&&v<f.min){showErr(f.label+' must be at least '+f.min+'.');return}}
      if(f.type==='email'&&v&&!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(v)){showErr('Enter a valid email address.');return}
      vals[f.name]=v;
    }
    const r=await onSubmit(vals,m); if(typeof r==='string'){showErr(r);return} if(r!==false)m.close();
  });
  const first=$('input:not([type=hidden]):not([type=file]):not([readonly]),select,textarea',form); if(first&&window.innerWidth>700)first.focus();
  return m;
}

/* ---------- list / table ---------- */
function renderList(host,cfg){
  const st=(UI[cfg.key]=UI[cfg.key]||{q:'',page:1,f:{}}); const size=cfg.pageSize||12;
  host.innerHTML=`<div class="toolbar">${cfg.noSearch?'':`<div class="search">${icon('search',16)}<input type="search" id="${cfg.key}-q" placeholder="${esc(cfg.placeholder||'Search')}" value="${esc(st.q)}" aria-label="Search"></div>`}${(cfg.filters||[]).map(f=>`<select data-f="${f.name}" aria-label="${esc(f.label)}"><option value="">${esc(f.label)}</option>${optionsHtml(f.options,st.f[f.name])}</select>`).join('')}${cfg.toolbar||''}</div><div class="table-wrap" id="${cfg.key}-tbl"></div><div class="pager" id="${cfg.key}-pg"></div>`;
  const draw=()=>{
    let rows=cfg.rows(); const q=st.q.trim().toLowerCase();
    (cfg.filters||[]).forEach(f=>{const v=st.f[f.name]; if(v)rows=rows.filter(r=>f.test(r,v))});
    if(q)rows=rows.filter(r=>cfg.text(r).toLowerCase().includes(q));
    const pages=Math.max(1,Math.ceil(rows.length/size)); if(st.page>pages)st.page=pages;
    const slice=rows.slice((st.page-1)*size,st.page*size);
    $('#'+cfg.key+'-tbl',host).innerHTML=slice.length?`<table><thead><tr>${cfg.cols.map(c=>`<th>${esc(c.label)}</th>`).join('')}${cfg.actions?'<th></th>':''}</tr></thead><tbody>${slice.map(r=>`<tr>${cfg.cols.map(c=>`<td class="${c.cls||''}">${c.render(r)}</td>`).join('')}${cfg.actions?`<td class="act">${cfg.actions(r)}</td>`:''}</tr>`).join('')}</tbody></table>`:`<div class="empty"><b>${esc(cfg.emptyTitle||'Nothing to show')}</b>${esc(cfg.empty||'No records match the current search or filters.')}</div>`;
    const from=rows.length?(st.page-1)*size+1:0, to=Math.min(rows.length,st.page*size);
    $('#'+cfg.key+'-pg',host).innerHTML=`<span>${rows.length?`Showing ${from}–${to} of ${rows.length}`:'0 records'}${cfg.foot?' · '+cfg.foot(rows):''}</span><div class="row"><button class="btn sm ghost" data-pg="-1" ${st.page<=1?'disabled':''}>Previous</button><span>Page ${st.page} of ${pages}</span><button class="btn sm ghost" data-pg="1" ${st.page>=pages?'disabled':''}>Next</button></div>`;
  };
  draw();
  const qi=$('#'+cfg.key+'-q',host); if(qi)qi.addEventListener('input',()=>{st.q=qi.value;st.page=1;draw()});
  host.addEventListener('change',e=>{const s=e.target.closest('select[data-f]'); if(s){st.f[s.dataset.f]=s.value;st.page=1;draw()}});
  host.addEventListener('click',e=>{
    const pg=e.target.closest('[data-pg]'); if(pg){st.page+=+pg.dataset.pg;draw();return}
    const a=e.target.closest('[data-act]'); if(a&&cfg.onAction)cfg.onAction(a.dataset.act,a.dataset.id,a);
  });
  return {draw};
}
const actBtn=(act,id,ic,label,cls='')=>`<button class="icon-btn sm ${cls}" data-act="${act}" data-id="${esc(id)}" title="${esc(label)}" aria-label="${esc(label)}">${icon(ic,15)}</button>`;
const eqCell=e=>`<div class="cell"><div class="thumb">${e.photo?`<img src="${esc(e.photo)}" alt="">`:icon('box',18)}</div><div style="min-width:0"><button class="linkish" data-act="view" data-id="${esc(e.id)}">${esc(e.name)}</button><span class="sub">${esc([e.brand,e.model].filter(Boolean).join(' '))}</span></div></div>`;

/* ---------- charts ---------- */
function donut(data){
  const tot=data.reduce((a,d)=>a+d.value,0)||1, R=52, C=2*Math.PI*R; let off=0;
  const arcs=data.filter(d=>d.value>0).map(d=>{const len=d.value/tot*C; const s=`<circle r="${R}" cx="70" cy="70" fill="none" stroke="var(--${d.token})" stroke-width="20" stroke-dasharray="${len.toFixed(2)} ${(C-len).toFixed(2)}" stroke-dashoffset="${(-off).toFixed(2)}" transform="rotate(-90 70 70)"><title>${esc(d.label)}: ${d.value}</title></circle>`; off+=len; return s}).join('');
  return `<svg width="140" height="140" viewBox="0 0 140 140" role="img" aria-label="Equipment by status"><circle r="${R}" cx="70" cy="70" fill="none" stroke="var(--muted-soft)" stroke-width="20"/>${arcs}<text x="70" y="68" text-anchor="middle" style="font-size:26px;font-weight:700;fill:var(--ink)">${data.reduce((a,d)=>a+d.value,0)}</text><text x="70" y="86" text-anchor="middle" class="chart-txt">items</text></svg>`;
}
function hbars(data){
  const max=Math.max(1,...data.map(d=>d.value));
  return data.length?data.map(d=>`<div class="hbar"><span class="l" title="${esc(d.label)}">${esc(d.label)}</span><span class="t"><i style="width:${Math.max(2,d.value/max*100)}%"></i></span><span class="v">${d.value}</span></div>`).join(''):'<div class="empty muted">No data yet</div>';
}
function columns(data){
  if(!data.length)return '<div class="empty muted">No data yet</div>';
  const W=420,H=190,L=34,B=24,T=16,max=Math.max(...data.map(d=>d.value))||1;
  const step=(()=>{const raw=max/4,p=Math.pow(10,Math.floor(Math.log10(raw||1)));const n=raw/p;return (n<=1?1:n<=2?2:n<=5?5:10)*p})(); const top=Math.ceil(max/step)*step;
  const bw=Math.min(40,(W-L-10)/data.length*.62), gap=(W-L-10)/data.length;
  let g=''; for(let v=0;v<=top;v+=step){const y=H-B-(v/top)*(H-B-T); g+=`<line x1="${L}" x2="${W-6}" y1="${y}" y2="${y}" stroke="var(--line)" stroke-width="1"/><text x="${L-6}" y="${y+3}" text-anchor="end" class="chart-txt">${compact(v)}</text>`}
  const bars=data.map((d,i)=>{const h=(d.value/top)*(H-B-T), x=L+gap*i+(gap-bw)/2, y=H-B-h; return `<rect x="${x}" y="${y}" width="${bw}" height="${Math.max(h,1)}" rx="2" fill="var(--accent)"><title>${esc(d.label)}: ${d.value}</title></rect><text x="${x+bw/2}" y="${H-8}" text-anchor="middle" class="chart-txt">${esc(d.label)}</text>${i===data.length-1?`<text x="${x+bw/2}" y="${y-5}" text-anchor="middle" class="chart-val">${compact(d.value)}</text>`:''}`}).join('');
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="Equipment acquired by year">${g}${bars}</svg>`;
}

/* ---------- file output ---------- */
async function saveFile(filename,data){
  try{
    const blob=data instanceof Blob?data:new Blob([data],{type:/\.json$/i.test(filename)?'application/json':'application/octet-stream'});
    const url=URL.createObjectURL(blob), a=document.createElement('a'); a.href=url; a.download=filename; document.body.appendChild(a); a.click(); a.remove();
    setTimeout(()=>URL.revokeObjectURL(url),4000); toast('Saved '+filename,'ok');
  }catch(err){ toast('Could not save the file.','bad') }
}
function libCheck(...names){ const miss=names.filter(n=>typeof window[n]==='undefined'&&!(n==='jspdf'&&window.jspdf)); if(miss.length){toast('Export library did not load ('+miss.join(', ')+'). Check your connection and reload.','bad');return false} return true }

function issuancePdf(iss,kind){

function accountabilityPdf(pid){

  const doc=newDoc('p'); let y=docHeader(doc,'Accountability Record',p.name+' · '+p.designation+' · '+deptName(p.deptId));
  doc.autoTable({startY:y,head:[['Property no.','Equipment','Serial no.','Issued','Type']],body:items.map(i=>{const e=getEq(i.equipId)||{};return[e.propNo,e.name+' ('+[e.brand,e.model].join(' ')+')',e.serial,fmtDate(i.issuedDate),i.type==='Borrow'?'Borrowed':'Assigned']}),styles:{fontSize:8.5,cellPadding:2},headStyles:{fillColor:[13,26,60]},margin:{left:14,right:14}});
  y=doc.lastAutoTable.finalY+6; doc.setFontSize(10);doc.text('Total items in custody: '+items.length,14,y);
  sigBlock(doc,y+30,['Property Custodian',''],[p.name,'Accountable officer']);

}
function tagsPdf(list){
  if(!libCheck('jspdf'))return; const doc=newDoc('p'); const W=95,H=55,mx=10,my=10,gx=5,gy=4; let k=0;
  list.forEach(e=>{
    if(k>0&&k%10===0)doc.addPage(); const slot=k%10, col=slot%2, row=Math.floor(slot/2), x=mx+col*(W+gx), y=my+row*(H+gy); k++;
    doc.setDrawColor(20,32,29);doc.setLineWidth(.4);doc.rect(x,y,W,H);
    doc.setFillColor(233,165,26);doc.rect(x,y,W,7,'F');doc.setTextColor(43,29,0);doc.setFont('helvetica','bold');doc.setFontSize(7.5);doc.text('GEBPSOICS  PROPERTY TAG',x+3,y+4.7);doc.text('DO NOT REMOVE',x+W-3,y+4.7,{align:'right'});
    const q=qrMake(qrPayload(e));
    if(q){const n=q.getModuleCount(), s=26, m=s/(n+4); doc.setFillColor(255,255,255);doc.rect(x+3,y+10,s,s,'F');doc.setFillColor(0,0,0);for(let r=0;r<n;r++)for(let c=0;c<n;c++)if(q.isDark(r,c))doc.rect(x+3+(c+2)*m,y+10+(r+2)*m,m+.01,m+.01,'F')}
    doc.setTextColor(20,32,29);doc.setFont('courier','bold');doc.setFontSize(10.5);doc.text(e.propNo,x+33,y+14);
    doc.setFont('helvetica','bold');doc.setFontSize(8.5);doc.text(doc.splitTextToSize(e.name,W-37).slice(0,2),x+33,y+19);
    doc.setFont('helvetica','normal');doc.setFontSize(7);doc.setTextColor(77,93,89);
    doc.text([[e.brand,e.model].filter(Boolean).join(' ').slice(0,38),'S/N '+(e.serial||'—'),'Acquired '+fmtDate(e.acqDate),deptName(deptOfEq(e)).slice(0,38)],x+33,y+27.5);
    const {total,bars}=barcodeBars(e.barcode), bx=x+4, bw=W-8, mod=bw/total; doc.setFillColor(0,0,0);
    bars.forEach(b=>doc.rect(bx+b[0]*mod,y+H-12.5,b[1]*mod,7.5,'F'));
    doc.setFont('courier','normal');doc.setFontSize(7);doc.setTextColor(20,32,29);doc.text(e.barcode.split('').join(' '),x+W/2,y+H-2.6,{align:'center'});
  });
  return pdfBuf(doc);
}
function xlsxBuf(title,head,body,sub){
  const aoa=[[title],[sub||('Generated '+fmtDate(todayStr()))],[],head,...body];
  const ws=XLSX.utils.aoa_to_sheet(aoa); ws['!cols']=head.map((h,i)=>({wch:Math.min(46,Math.max(String(h).length+2,...body.slice(0,60).map(r=>String(r[i]==null?'':r[i]).length+2)))}));
  const wb=XLSX.utils.book_new(); XLSX.utils.book_append_sheet(wb,ws,'Report'.slice(0,31));
  return XLSX.write(wb,{type:'array',bookType:'xlsx'});
}

async function issueEquipment(v){
  try{
    const j=await api('POST','/issuances',{equipment_id:Number(v.equipId),personnel_id:Number(v.personId),type:v.type,issued_date:v.issuedDate,due_date:v.type==='Borrow'?(v.dueDate||null):null,received_by:v.receivedBy||'',purpose:v.purpose||'',remarks:v.remarks||''});
    await reload('issuances','equipment','personnel'); return DB.issuances.find(i=>i.id===S(j.data.id))||mapIssue(j.data);
  }catch(e){return errText(e)}
}
async function returnEquipment(issId,v){
  try{
    await api('POST','/issuances/'+issId+'/return',{returned_date:v.returnDate,condition:v.condition,remarks:v.remarks||''});
    await reload('issuances','equipment','personnel'); return DB.issuances.find(i=>i.id===issId);
  }catch(e){return errText(e)}
}
async function transferEquipment(v){
  try{ await api('POST','/transfers',{equipment_id:Number(v.equipId),to_room_id:Number(v.toRoomId),transfer_date:v.date,reason:v.reason}); await reload('transfers','equipment'); return true }
  catch(e){return errText(e)}
}

    <div class="field"><label for="r_name">Full name <i style="color:var(--bad)">*</i></label><input id="r_name" name="name" required autocomplete="name"></div>
    <div class="form-grid"><div class="field"><label for="r_user">Username <i style="color:var(--bad)">*</i></label><input id="r_user" name="username" required autocomplete="username"></div>
    <div class="field"><label for="r_email">Email <i style="color:var(--bad)">*</i></label><input id="r_email" name="email" type="email" required autocomplete="email"></div>
    <div class="field"><label for="r_pos">Position</label><input id="r_pos" name="position" placeholder="Teacher I"></div>
    <div class="field"><label for="r_dept">Department</label><select id="r_dept" name="deptId">${optionsHtml(DB.depts.map(d=>({v:d.id,l:d.name})),'','Select')}</select></div>
    <div class="field"><label for="r_pw">Password <i style="color:var(--bad)">*</i></label><input id="r_pw" name="pw" type="password" autocomplete="new-password" required></div>
    <div class="field"><label for="r_pw2">Confirm password <i style="color:var(--bad)">*</i></label><input id="r_pw2" name="pw2" type="password" autocomplete="new-password" required></div></div>
    <p class="form-err" id="autherr" role="alert" hidden></p><button class="btn primary" type="submit" style="padding:11px">Submit registration</button>
    <div class="auth-links"><button type="button" data-go="login">Back to sign in</button></div></form>`;
  } else if(mode==='forgot'){
    form=`<form class="auth-card" id="authform" novalidate><div><h2>Forgot password</h2><p class="muted">Enter the email on your account. If it matches an active account we send a link that lets you choose a new password. The link works for 1 hour.</p></div>

  } else if(mode==='reset'){
    form=`<form class="auth-card" id="authform" novalidate><div><h2>Choose a new password</h2><p class="muted">At least 8 characters, with letters and numbers.</p></div>
    <div class="field"><label for="f_pw">New password</label><input id="f_pw" name="pw" type="password" required autocomplete="new-password"></div>
    <div class="field"><label for="f_pw2">Confirm new password</label><input id="f_pw2" name="pw2" type="password" required autocomplete="new-password"></div>
    <p class="form-err" id="autherr" role="alert" hidden></p><button class="btn primary" type="submit" style="padding:11px">Save new password</button>

  } else if(mode==='force'){
    form=`<form class="auth-card" id="authform" novalidate><div><h2>Set your own password</h2><p class="muted">${esc(note||'You are using a temporary password. Choose a new one to continue.')}</p></div>

    <div class="field"><label for="f_pw2">Confirm new password</label><input id="f_pw2" name="pw2" type="password" required autocomplete="new-password"></div>
    <p class="form-err" id="autherr" role="alert" hidden></p><button class="btn primary" type="submit" style="padding:11px">Save and continue</button>
    <div class="auth-links"><button type="button" data-go="login" data-signout>Sign out</button></div></form>`;
  }
  $('#app').innerHTML=`<div class="auth">${art}<div class="auth-form"><div class="auth-top">${clockHtml()}${themeSwitch()}</div>${form}<footer class="auth-foot">${CREDIT}</footer></div></div>`; tickClock();
  const f=$('#authform'), err=$('#autherr'); const bad=t=>{err.textContent=t;err.hidden=false};

  const pwOk=p=>p.length>=8&&p.length<=72&&/[A-Za-z]/.test(p)&&/\d/.test(p);

        renderAuth('login',j.data.message);

        if(!g('email'))return bad('Enter your email address.');
        busy(true); const j=await api('POST','/auth/forgot-password',{email:g('email')},{noAuth:true}); renderAuth('login',j.data.message);
      } else if(mode==='reset'){
        if(!pwOk(f.elements.pw.value))return bad('Password needs 8 or more characters, with letters and numbers.');
        if(f.elements.pw.value!==f.elements.pw2.value)return bad('Passwords do not match.');
        busy(true); await api('POST','/auth/reset-password',{token:resetToken,new_password:f.elements.pw.value},{noAuth:true}); renderAuth('login','Password updated. Sign in with your new password.');
      } else if(mode==='force'){
        if(!f.elements.cur.value)return bad('Enter your current password.');
        if(!pwOk(f.elements.pw.value))return bad('Password needs 8 or more characters, with letters and numbers.');
        if(f.elements.pw.value!==f.elements.pw2.value)return bad('Passwords do not match.');
        busy(true); await api('POST','/auth/change-password',{current_password:f.elements.cur.value,new_password:f.elements.pw.value});
        ME.mustChange=false; await startSession();
      }
    }catch(e){ busy(false); bad(errText(e)) }
  });
  const first=$('input',f); if(first&&window.innerWidth>700)first.focus();
}

function lookupEquipment(q){
  const s=String(q).trim().replace(/^GEBPSOICS:/i,'').toLowerCase(); if(!s)return [];
  const exact=DB.equipment.filter(e=>e.propNo.toLowerCase()===s||e.barcode===s||(e.serial||'').toLowerCase()===s);
  if(exact.length)return exact;
  return DB.equipment.filter(e=>(e.propNo+' '+e.barcode+' '+e.name+' '+e.serial+' '+e.brand+' '+e.model).toLowerCase().includes(s));
}

VIEWS.dashboard=host=>{

  const E=DB.equipment, counts={}; STATUSES.forEach(s=>counts[s]=E.filter(e=>e.status===s).length);
  const tot=E.length, pct=n=>tot?Math.round(n/tot*100)+'%':'0%';
  const byDept=DB.depts.map(d=>({label:d.name,value:E.filter(e=>deptOfEq(e)===d.id).length})).filter(d=>d.value).sort((a,b)=>b.value-a.value);
  const byCat=DB.cats.map(c=>({label:c.name,value:E.filter(e=>e.catId===c.id).length})).filter(d=>d.value).sort((a,b)=>b.value-a.value);
  const years={}; E.forEach(e=>{const y=(e.acqDate||'').slice(0,4); if(y)years[y]=(years[y]||0)+1});
  const yData=Object.keys(years).sort().slice(-7).map(y=>({label:y,value:years[y]}));
  const recent=[...E].sort((a,b)=>String(b.createdAt).localeCompare(String(a.createdAt))).slice(0,5);
  const pend=DB.requests.filter(r=>r.status==='Pending').slice(0,5);
  const alerts=buildAlerts().filter(a=>['maintenance','overdue','stock','approval'].includes(a.type)).slice(0,6);
  host.innerHTML=pageHead('Dashboard',`Inventory position as of ${fmtDate(todayStr())}.`,can('equipment')?`<button class="btn primary" data-go-add>${icon('plus',16)} Add equipment</button>`:'')+
  `<div class="stat-strip" style="margin-top:16px"><button class="stat c-tot" data-status=""><span class="lab"><i class="dot"></i>Registered</span><span class="val">${tot}</span><span class="pct">all equipment</span></button>${STATUSES.map(s=>`<button class="stat c-${STATUS_C[s]}" data-status="${s}"><span class="lab"><i class="dot"></i>${s}</span><span class="val">${counts[s]}</span><span class="pct">${pct(counts[s])} of total</span></button>`).join('')}</div>
  <div class="grid cols-2" style="margin-top:16px"><section class="card"><div class="card-h"><h2>Equipment by status</h2></div><div class="card-b"><div class="donut-wrap">${donut(STATUSES.map(s=>({label:s,value:counts[s],token:({ok:'ok',info:'info',purple:'purple',warn:'warn',bad:'bad'})[STATUS_C[s]]})))}<div class="legend">${STATUSES.map(s=>`<div><i class="dot c-${STATUS_C[s]}"></i>${s}<b>${counts[s]}</b></div>`).join('')}</div></div></div></section>
  <section class="card"><div class="card-h"><h2>Distribution by department</h2></div><div class="card-b">${hbars(byDept)}</div></section></div>
  <div class="grid cols-2" style="margin-top:16px"><section class="card"><div class="card-h"><h2>Equipment acquired by year</h2></div><div class="card-b">${columns(yData)}</div></section>
  <section class="card"><div class="card-h"><h2>Equipment by category</h2></div><div class="card-b">${hbars(byCat)}</div></section></div>
  <div class="grid cols-3" style="margin-top:16px"><section class="card"><div class="card-h"><h2>Recently added</h2></div><div class="card-b"><div class="list">${recent.map(e=>`<div class="list-item"><div class="thumb">${e.photo?`<img src="${esc(e.photo)}" alt="">`:icon('box',18)}</div><div class="grow"><button class="linkish" data-view="${e.id}">${esc(e.name)}</button><span class="mono">${esc(e.propNo)} · ${fmtDate(e.createdAt)}</span></div>${pill(e.status)}</div>`).join('')||'<div class="empty muted">No equipment yet</div>'}</div></div></section>
  <section class="card"><div class="card-h"><h2>Pending equipment requests</h2><a href="#requests">View all</a></div><div class="card-b"><div class="list">${pend.map(r=>`<div class="list-item"><div class="alert-ico">${icon('inbox',16)}</div><div class="grow"><b>${r.qty} × ${esc(r.item)}</b><span>${esc(userName(r.requestedBy))} · ${esc(deptName(r.deptId))} · ${fmtDate(r.date)}</span></div></div>`).join('')||'<div class="empty muted"><b>All caught up</b>No requests waiting for a decision.</div>'}</div></div></section>
  <section class="card"><div class="card-h"><h2>Maintenance &amp; alerts</h2><a href="#notifications">All notifications</a></div><div class="card-b"><div class="list">${alerts.map(a=>`<div class="list-item"><div class="alert-ico ${a.sev}">${icon(a.sev==='bad'?'alert':a.type==='stock'?'box':'clock',16)}</div><div class="grow"><b>${esc(a.title)}</b><span>${esc(a.text)}</span></div></div>`).join('')||'<div class="empty muted"><b>No alerts</b>Nothing needs attention right now.</div>'}</div></div></section></div>`;
  host.onclick=e=>{
    const s=e.target.closest('[data-status]'); if(s&&can('viewAll')){goEquipment(s.dataset.status?{status:s.dataset.status}:{});return}
    const v=e.target.closest('[data-view]'); if(v)openEquipment(v.dataset.view);
    if(e.target.closest('[data-go-add]'))openEquipmentForm();
  };
};
function dashStaff(host){
  const mine=myActive(), T=todayStr();
  const over=mine.filter(i=>i.type==='Borrow'&&i.dueDate&&i.dueDate<T).length;
  const myReq=DB.requests.filter(r=>r.requestedBy===ME.id), myMaint=DB.maintenance.filter(m=>m.reportedBy===ME.id&&['Requested','Scheduled','In Progress'].includes(m.status));
  const alerts=buildAlerts().slice(0,5);
  host.innerHTML=pageHead('Welcome, '+ME.name.split(' ')[0],'Your assigned equipment, requests and reminders.',`<a class="btn primary" href="#requests">${icon('plus',16)} Request equipment</a><a class="btn" href="#maintenance">${icon('tool',16)} Report a problem</a>`)+
  `<div class="stat-strip" style="margin-top:16px;grid-template-columns:repeat(4,minmax(0,1fr))"><div class="stat c-info"><span class="lab"><i class="dot"></i>Assigned to me</span><span class="val">${mine.filter(i=>i.type==='Assignment').length}</span></div><div class="stat c-purple"><span class="lab"><i class="dot"></i>Borrowed</span><span class="val">${mine.filter(i=>i.type==='Borrow').length}</span></div><div class="stat c-bad"><span class="lab"><i class="dot"></i>Overdue returns</span><span class="val">${over}</span></div><div class="stat c-warn"><span class="lab"><i class="dot"></i>Open requests</span><span class="val">${myReq.filter(r=>r.status==='Pending').length+myMaint.length}</span></div></div>
  <div class="grid cols-2" style="margin-top:16px"><section class="card"><div class="card-h"><h2>My equipment</h2><a href="#my">View all</a></div><div class="card-b"><div class="list">${mine.slice(0,5).map(i=>{const e=getEq(i.equipId)||{};return `<div class="list-item"><div class="thumb">${icon('box',18)}</div><div class="grow"><b>${esc(e.name)}</b><span class="mono">${esc(e.propNo)}</span></div>${i.type==='Borrow'?pill('Due '+fmtDate(i.dueDate),i.dueDate<T?'bad':'info'):pill('Assigned','ok')}</div>`}).join('')||`<div class="empty muted"><b>Nothing assigned yet</b>${ME.personId?'Request equipment from the custodian.':'Ask the property custodian to link your account to a personnel record.'}</div>`}</div></div></section>
  <section class="card"><div class="card-h"><h2>Reminders</h2><a href="#notifications">All</a></div><div class="card-b"><div class="list">${alerts.map(a=>`<div class="list-item"><div class="alert-ico ${a.sev}">${icon('bell',16)}</div><div class="grow"><b>${esc(a.title)}</b><span>${esc(a.text)}</span></div></div>`).join('')||'<div class="empty muted"><b>No reminders</b>You are up to date.</div>'}</div></div></section></div>`;
}
VIEWS.my=host=>{
  const mine=DB.issuances.filter(i=>i.personId===myPersonId()), T=todayStr();
  host.innerHTML=pageHead('My Equipment','Equipment under your accountability, with borrow due dates.',myPersonId()?`<button class="btn" data-pdf>${icon('download',15)} Accountability record (PDF)</button>`:'')+
  `<section class="card" style="margin-top:16px">${myPersonId()?`<div class="table-wrap"><table><thead><tr><th>Property no.</th><th>Equipment</th><th>Type</th><th>Issued</th><th>Due / returned</th><th>Status</th><th></th></tr></thead><tbody>${mine.map(i=>{const e=getEq(i.equipId)||{};const od=i.status==='Active'&&i.type==='Borrow'&&i.dueDate<T;return `<tr><td class="mono">${esc(e.propNo)}</td><td>${esc(e.name)}<span class="sub">${esc([e.brand,e.model].filter(Boolean).join(' '))}</span></td><td>${i.type==='Borrow'?'Borrowed':'Assigned'}</td><td>${fmtDate(i.issuedDate)}</td><td>${i.status==='Returned'?fmtDate(i.returnDate):(i.type==='Borrow'?fmtDate(i.dueDate):'—')}</td><td>${pill(od?'Overdue':i.status)}</td><td class="act">${i.status==='Active'?`<button class="btn sm" data-report="${e.id}">Report problem</button>`:''}</td></tr>`}).join('')||'<tr><td colspan="7"><div class="empty"><b>No equipment yet</b>Items issued to you will appear here.</div></td></tr>'}</tbody></table></div>`:`<div class="empty"><b>Account not linked</b>Ask the property custodian or administrator to link your account to your personnel record.</div>`}</section>`;
  host.onclick=async e=>{
    const r=e.target.closest('[data-report]'); if(r)openMaintRequestForm(r.dataset.report);
    if(e.target.closest('[data-pdf]')){const b=accountabilityPdf(myPersonId()); if(b)await saveFile('accountability-'+stamp()+'.pdf',b)}
  };
};

/* ---------- equipment ---------- */
function eqFormFields(e){
  const deployed=e&&(e.status==='Deployed'||e.status==='Under Repair');
  return [
    {type:'section',label:'Identification'},
    {name:'propNo',label:'Property number',required:!!e,span:2,placeholder:'e.g. GEB-2026-IT-0001',hint:e?'You can correct the property number. It must be unique; the printed tag and QR code use it.':'Type your own property number. Leave blank to generate one automatically (GEB-year-category-number).'},
    {name:'name',label:'Equipment name',required:true,span:2,placeholder:'e.g. Laptop'},
    {name:'catId',label:'Category',type:'select',required:true,options:DB.cats.map(c=>({v:c.id,l:c.name})),placeholder:'Select category'},
    {name:'roomId',label:'Location (room)',type:'select',required:true,options:DB.rooms.map(r=>({v:r.id,l:r.name+' · '+deptName(r.deptId)})),placeholder:'Select room'},
    {name:'brand',label:'Brand'},{name:'model',label:'Model'},
    {name:'serial',label:'Serial number'},
    {name:'acqDate',label:'Acquisition date',type:'date',required:true,default:todayStr()},
    {type:'section',label:'Funding & status'},
    {name:'fund',label:'Funding source',type:'select',options:FUNDS,placeholder:'Select source'},
    deployed?{name:'status',label:'Status',readonly:true,hint:'Status changes through issuance and maintenance while the item is in use or being repaired.'}:{name:'status',label:'Status',type:'select',options:['Available','Defective','Condemned'],required:true},
    {name:'condition',label:'Condition',type:'select',options:CONDITIONS,required:true},
    {type:'section',label:'Details'},
    {name:'description',label:'Description',type:'textarea',span:2,rows:2},
    {name:'specs',label:'Specifications',type:'textarea',span:2,rows:3,placeholder:'Processor, memory, capacity, dimensions…'},
    {name:'photo',label:'Photo',type:'photo',span:2}
  ];
}
function openEquipmentForm(id){
  const e=id?getEq(id):null;
  openForm({title:e?'Edit equipment':'Add equipment',wide:true,fields:eqFormFields(e),values:e?Object.assign({},e):{status:'Available',condition:'New',acqDate:todayStr()},submit:e?'Save changes':'Register equipment',
    onSubmit:async v=>{
      const pn=String(v.propNo||'').trim(); const body={name:v.name,category_id:Number(v.catId),room_id:Number(v.roomId),brand:v.brand,model:v.model,serial_no:v.serial,acquisition_date:v.acqDate,funding_source:v.fund||'',condition:v.condition,description:v.description,specs:v.specs};
      if(pn)body.property_no=pn;
      let saved=null, photoMsg='';
      const r=await commit(async()=>{
        if(e){ if(!['Deployed','Under Repair'].includes(e.status)&&v.status!==e.status)body.status=v.status; saved=(await api('PUT','/equipment/'+e.id,body)).data }
        else { saved=(await api('POST','/equipment',body)).data; if(v.status&&v.status!=='Available')await api('PUT','/equipment/'+saved.id,{status:v.status}) }
        if(v.photo&&String(v.photo).startsWith('data:')){ try{await api('POST','/equipment/'+saved.id+'/photo',{data:v.photo})}catch(x){photoMsg=' The photo could not be saved: '+errText(x)} }
      },'equipment');
      if(r===true){ toast((e?'Saved ':'Registered ')+(saved.property_no||'')+'.'+photoMsg,photoMsg?'warn':'ok') }
      return r;
    }});
}
function equipmentHistory(e){
  const ev=[];
  DB.issuances.filter(i=>i.equipId===e.id).forEach(i=>{ev.push({d:i.issuedDate,t:`${i.type==='Borrow'?'Borrowed by':'Issued to'} ${personName(i.personId)} (${i.no})`});if(i.status==='Returned')ev.push({d:i.returnDate,t:`Returned by ${personName(i.personId)}, condition ${i.returnCondition||'recorded'}`})});
  DB.transfers.filter(t=>t.equipId===e.id).forEach(t=>ev.push({d:t.date,t:`Transferred ${roomName(t.fromRoomId)} → ${roomName(t.toRoomId)}`}));
  DB.maintenance.filter(m=>m.equipId===e.id).forEach(m=>ev.push({d:m.completedDate||m.scheduledDate||m.reportedDate,t:`${m.type} maintenance, ${m.status.toLowerCase()}: ${m.problem}${m.cost?' ('+peso(m.cost)+')':''}`}));
  ev.push({d:(e.createdAt||'').slice(0,10),t:'Registered in inventory'});
  return ev.sort((a,b)=>String(b.d).localeCompare(String(a.d)));
}
function openEquipment(id){
  const e=getEq(id); if(!e)return; const hist=equipmentHistory(e);
  const mg=can('equipment'), mt=can('maintenance');
  const foot=`<button class="btn" data-a="tag">${icon('download',15)} Property tag (PDF)</button>${mg&&e.status==='Available'?'<button class="btn" data-a="issue">Issue</button>':''}${mg?'<button class="btn" data-a="transfer">Transfer</button>':''}${(mt||ME.role==='staff')?'<button class="btn" data-a="report">Report problem</button>':''}${mg?`<button class="btn primary" data-a="edit">${icon('edit',15)} Edit</button>`:''}`;
  const m=openModal({title:'Equipment record',wide:true,foot,body:`<div class="stack" style="gap:20px"><div class="detail-top"><div class="detail-photo">${e.photo?`<img src="${esc(e.photo)}" alt="${esc(e.name)}">`:icon('box',44)}</div><div class="stack" style="gap:8px"><div><h3 style="font-size:20px">${esc(e.name)}</h3><div class="mono muted">${esc(e.propNo)}</div></div><div class="row">${pill(e.status)}${pill(e.condition)}</div><p class="muted">${esc(e.description||'')}</p></div></div>
  <dl class="kv"><div><dt>Category</dt><dd>${esc(catName(e.catId))}</dd></div><div><dt>Location</dt><dd>${esc(roomName(e.roomId))} · ${esc(deptName(deptOfEq(e)))}</dd></div><div><dt>Brand / model</dt><dd>${esc([e.brand,e.model].filter(Boolean).join(' ')||'—')}</dd></div><div><dt>Serial number</dt><dd class="mono">${esc(e.serial||'—')}</dd></div><div><dt>Acquired</dt><dd>${fmtDate(e.acqDate)}</dd></div><div><dt>Funding source</dt><dd>${esc(e.fund||'—')}</dd></div><div><dt>Accountable person</dt><dd>${e.assignedTo?esc(personName(e.assignedTo)):'Not assigned'}</dd></div><div><dt>Barcode</dt><dd class="mono">${esc(e.barcode)}</dd></div><div style="grid-column:1/-1"><dt>Specifications</dt><dd>${esc(e.specs||'—')}</dd></div></dl>
  <div class="grid cols-2"><div><h3 style="font-size:13px;margin-bottom:8px">Property tag</h3>${tagHtml(e)}</div><div><h3 style="font-size:13px;margin-bottom:8px">History</h3><ul class="timeline">${hist.map(h=>`<li>${esc(h.t)}<small>${fmtDate(h.d)}</small></li>`).join('')}</ul></div></div></div>`});
  if(e.hasPhoto){api('GET','/equipment/'+e.id).then(j=>{const u=j.data&&j.data.photo_url,box=$('.detail-photo',m.el); if(u&&box)box.innerHTML=`<img src="${esc(u)}" alt="${esc(e.name)}">`}).catch(()=>{})}
  m.el.addEventListener('click',async ev=>{
    const a=ev.target.closest('[data-a]'); if(!a)return; const k=a.dataset.a;
    if(k==='tag'){const b=tagsPdf([e]); if(b)await saveFile('tag-'+e.propNo+'.pdf',b);return}
    m.close();
    if(k==='edit')openEquipmentForm(e.id); if(k==='issue')openIssueForm(e.id); if(k==='transfer')openTransferForm(e.id); if(k==='report')openMaintRequestForm(e.id);
  });
}
VIEWS.equipment=host=>{
  const tab=UI.eqTab||'equipment', mg=can('equipment');
  host.innerHTML=pageHead('Equipment','Register, track and maintain every property item and supply.',mg?`<button class="btn primary" id="add-eq">${icon('plus',16)} Add equipment</button><button class="btn" id="add-sup">${icon('plus',16)} Add supply</button>`:'')+
  `<section class="card" style="margin-top:16px"><div class="tabs" role="tablist"><button role="tab" data-tab="equipment" aria-selected="${tab==='equipment'}">Equipment <span class="badge" style="background:var(--muted-soft);color:var(--muted)">${DB.equipment.length}</span></button><button role="tab" data-tab="supplies" aria-selected="${tab==='supplies'}">Supplies${DB.supplies.some(s=>s.qty<=s.reorder)?` <span class="badge">${DB.supplies.filter(s=>s.qty<=s.reorder).length}</span>`:''}</button></div><div id="tab-body"></div></section>`;
  $$('[data-tab]',host).forEach(b=>b.onclick=()=>{UI.eqTab=b.dataset.tab;route()});
  if($('#add-eq'))$('#add-eq').onclick=()=>openEquipmentForm(); if($('#add-sup'))$('#add-sup').onclick=()=>openSupplyForm();
  const body=$('#tab-body');
  if(tab==='supplies')return suppliesList(body);
  renderList(body,{key:'equipment',placeholder:'Search name, property no., serial, barcode',pageSize:12,
    rows:()=>[...DB.equipment].sort((a,b)=>String(b.createdAt).localeCompare(String(a.createdAt))),text:e=>[e.propNo,e.barcode,e.name,e.brand,e.model,e.serial,roomName(e.roomId),personName(e.assignedTo)].join(' '),
    filters:[{name:'cat',label:'All categories',options:DB.cats.map(c=>({v:c.id,l:c.name})),test:(e,v)=>e.catId===v},{name:'status',label:'All statuses',options:STATUSES,test:(e,v)=>e.status===v},{name:'dept',label:'All departments',options:DB.depts.map(d=>({v:d.id,l:d.name})),test:(e,v)=>deptOfEq(e)===v},{name:'cond',label:'Any condition',options:CONDITIONS,test:(e,v)=>e.condition===v}],
    toolbar:`<span class="spacer"></span>${exportBtns('data-expq')}`,
    cols:[{label:'Property no.',cls:'mono',render:e=>esc(e.propNo)},{label:'Equipment',render:eqCell},{label:'Category',render:e=>esc(catName(e.catId))},{label:'Location',render:e=>`${esc(roomName(e.roomId))}<span class="sub">${esc(deptName(deptOfEq(e)))}</span>`},{label:'Assigned to',render:e=>e.assignedTo?esc(personName(e.assignedTo)):'<span class="muted">—</span>'},{label:'Status',render:e=>pill(e.status)},{label:'Condition',render:e=>pill(e.condition)}],
    actions:e=>actBtn('view',e.id,'eye','View details')+(mg?actBtn('edit',e.id,'edit','Edit')+actBtn('del',e.id,'trash','Delete','danger'):''),
    foot:rows=>plural(rows.length,'item'),
    onAction:async(act,id)=>{
      if(act==='view')openEquipment(id); if(act==='edit')openEquipmentForm(id);
      if(act==='del'){const e=getEq(id); if(await confirmBox({title:'Delete equipment',danger:true,confirmLabel:'Delete record',message:`Delete <b>${esc(e.name)}</b> (<span class="mono">${esc(e.propNo)}</span>)? This cannot be undone. Items that already have issuance or maintenance history cannot be deleted; mark them Condemned instead.`})){
        await commitToast(()=>api('DELETE','/equipment/'+id),'Equipment deleted','equipment')}}
    }});
  body.addEventListener('click',e=>{const b=e.target.closest('[data-expq]'); if(!b)return; const st=UI.equipment||{q:'',f:{}};
    let rows=DB.equipment; const f=st.f||{}; if(f.cat)rows=rows.filter(x=>x.catId===f.cat); if(f.status)rows=rows.filter(x=>x.status===f.status); if(f.dept)rows=rows.filter(x=>deptOfEq(x)===f.dept); if(f.cond)rows=rows.filter(x=>x.condition===f.cond);
    const q=(st.q||'').toLowerCase(); if(q)rows=rows.filter(x=>[x.propNo,x.barcode,x.name,x.brand,x.model,x.serial].join(' ').toLowerCase().includes(q));
    exportTable(b.dataset.expq,{title:'Equipment List',sub:rows.length+' records · '+fmtDate(todayStr()),head:eqHead,body:rows.map(x=>eqRow(x)),xbody:rows.map(x=>eqRow(x,true)),file:'equipment-list-'+stamp(),orient:'l'})});
};

/* ---------- supplies ---------- */
function openSupplyForm(id){
  const s=id?DB.supplies.find(x=>x.id===id):null;
  openForm({title:s?'Edit supply':'Add supply',values:s||{unit:'pc'},fields:[{name:'name',label:'Item name',required:true,span:2},{name:'unit',label:'Unit',required:true,placeholder:'ream, box, pc'},{name:'roomId',label:'Stored in',type:'select',options:DB.rooms.map(r=>({v:r.id,l:r.name})),placeholder:'Select room'},{name:'qty',label:'Quantity on hand',type:'number',min:0,required:true,default:0},{name:'reorder',label:'Reorder level',type:'number',min:0,required:true,default:5,hint:'An alert appears when stock reaches this level.'}],
    onSubmit:v=>commit(()=>{const b={name:v.name,unit:v.unit,qty:v.qty,reorder_level:v.reorder,room_id:idOrNull(v.roomId)}; return s?api('PUT','/supplies/'+s.id,b):api('POST','/supplies',b)},'supplies')});
}
function suppliesList(host){
  const mg=can('equipment');
  renderList(host,{key:'supplies',placeholder:'Search supplies',pageSize:12,rows:()=>DB.supplies,text:s=>s.name+' '+roomName(s.roomId),
    filters:[{name:'st',label:'All stock levels',options:['Low stock','In stock'],test:(s,v)=>(s.qty<=s.reorder)===(v==='Low stock')}],
    cols:[{label:'Item',render:s=>`<b>${esc(s.name)}</b>`},{label:'Stored in',render:s=>esc(roomName(s.roomId))},{label:'On hand',cls:'num',render:s=>mg?`<span class="row" style="gap:6px;flex-wrap:nowrap"><button class="icon-btn sm" data-act="dec" data-id="${s.id}" aria-label="Decrease">−</button><b style="min-width:42px;text-align:center">${s.qty}</b><button class="icon-btn sm" data-act="inc" data-id="${s.id}" aria-label="Increase">+</button><span class="muted">${esc(s.unit)}</span></span>`:`${s.qty} ${esc(s.unit)}`},{label:'Reorder at',cls:'num',render:s=>s.reorder},{label:'Status',render:s=>s.qty<=s.reorder?pill(s.qty===0?'Out of stock':'Low stock','bad'):pill('In stock','ok')}],
    actions:s=>mg?actBtn('edit',s.id,'edit','Edit')+actBtn('del',s.id,'trash','Delete','danger'):'',
